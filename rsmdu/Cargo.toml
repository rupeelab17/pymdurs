[package]
name = "rsmdu"
version = "0.1.18"
edition = "2021"
description = "Rust transpilation of pymdu (Python Urban Data Model) - Core library"
license = "GPL-3.0"
repository = "https://github.com/rupeelab17/pymdurs"
homepage = "https://github.com/rupeelab17/pymdurs"
documentation = "https://github.com/rupeelab17/pymdurs#readme"

[features]
# polars opt-in: only BuildingCollection::{to_polars_df,to_gdf} — heavy compile
default = ["proj", "umep", "gdal", "reqwest", "las", "laz", "geos", "quick-xml", "progressbar", "rayon", "laz-memmap", "ndarray"]
wasm = []
umep = []
gdal_src = ["gdal/gdal-src"]
# Use memory-mapped I/O for large cached LAZ files (>50 MiB) to reduce RAM usage
laz-memmap = ["memmap2"]
# COPC (Cloud Optimized Point Cloud) support via las::copc::CopcEntryReader
lidar-copc = []
# Headless wgpu compute for LiDAR DSM/DTM max-Z binning (same stack as UMEP solweig)
gpu = ["wgpu", "pollster", "bytemuck"]
# Progress bars via the indicatif crate
progressbar = ["dep:indicatif"]
# Building → Polars DataFrame export (to_polars_df / to_gdf)
polars = ["dep:polars", "dep:ethnum"]

[dependencies]
# GeoRust ecosystem
geo = { version = "0.33", features = ["serde"] }
geojson = "1.0"
geos = { version = "11.3", features = ["geo"], optional = true }
geotiff = { version = "0.1", optional = true }
# 0.31 required for proj-sys 0.27 compatibility with gdal/gdal-src
proj = { version = "0.31", optional = true }
# gdal = { version = "0.19", features = ["bindgen"], optional = true }
gdal = { version = "0.19", git = "https://github.com/AlexanderWillner/gdal.git", branch = "fix/gdal-3.13-compat", features = ["bindgen"], optional = true }

rstar = "0.14"

# Data processing (opt-in via feature "polars")
polars = { version = "0.55", features = ["lazy", "temporal", "strings"], optional = true }
# polars-arrow pulls this; 1.5.2 transmutes () into TryFromIntError (E0512 on rustc 1.97+)
ethnum = { version = "1.5.3", optional = true }

# HTTP and serialization
# rustls (not OpenSSL) for manylinux CI.
# Pin 0.12: reqwest 0.13+rustls → Connection reset by peer on data.geopf.fr (WFS/LiDAR).
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging (silent until `logging::init` / RUST_LOG)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
url = "2.5"
csv = "1.4"
quick-xml = { version = "0.42", features = ["serialize"], optional = true }
encoding_rs = "0.8"
urlencoding = "2.1"
zip = "9.5"
tempfile = "3.27"
indicatif = { version = "0.18", optional = true }
rayon = { version = "1.12", optional = true }
ndarray = { version = "0.17", optional = true }

# LiDAR processing
las = { version = "0.11", features = ["laz-parallel"], optional = true }
# "copc" feature enabled via lidar-copc for CopcEntryReader
laz = { version = "0.13", optional = true }
memmap2 = { version = "0.9", optional = true }

# Optional GPU compute (feature = "gpu") — aligned with UMEP-dev/solweig
wgpu = { version = "27.0", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.24", optional = true, features = ["derive"] }
rustc-hash = "2.1.3"


# [[bin]]
# name = "rsmdu"
# path = "src/main.rs"

[lib]
name = "rsmdu"
crate-type = ["rlib", "cdylib"]

[[example]]
name = "building_complete"
required-features = ["polars"]
[[example]]
name = "building_from_ign"
required-features = ["polars"]
[[example]]
name = "building_from_ign_api"
required-features = ["polars"]
[[example]]
name = "building_from_geojson"
required-features = ["polars"]
[[example]]
name = "building_manual"
required-features = ["polars"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
