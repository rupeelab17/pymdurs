# cargo deny init — adapté rsmdu (GPL-3.0 + gdal git + rustls)

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
# Aligné CI : pas gdal_src / gpu / polars
all-features = false
features = ["lidar-copc"]

[advisories]
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "bzip2-1.0.6",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "MPL-2.0",
    "GPL-3.0",
    "GPL-3.0-or-later",
    "LGPL-3.0",
    "LGPL-3.0-or-later",
    "LGPL-2.1",
    "LGPL-2.1-or-later",
]

# gdal-src ships license-file=source/LICENSE.TXT (GDAL MIT-style) but no SPDX
# `license` field; cargo-deny cannot machine-read that multi-license dump.
[[licenses.clarify]]
crate = "gdal-src"
expression = "MIT"
license-files = [{ path = "source/LICENSE.TXT", hash = 0x071ad662 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/AlexanderWillner/gdal.git",
    "https://github.com/georust/proj.git",
]
