[package]
name = "pymdurs"
version = "0.1.12"
edition = "2021"
description = "Python bindings for rsmdu - Rust transpilation of pymdu"
license = "GPL-3.0"
repository = "https://github.com/rupeelab17/pymdurs"
homepage = "https://github.com/rupeelab17/pymdurs"
documentation = "https://github.com/rupeelab17/pymdurs#readme"

[features]
default = ["extension-module", "lidar-copc"]
extension-module = ["pyo3/extension-module"]
# COPC (Cloud Optimized Point Cloud) support via las::copc::CopcEntryReader
lidar-copc = ["rsmdu/lidar-copc"]

[lib]
name = "pymdurs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
required-features = []

[dependencies]
# PyO3 for Python bindings (extension-module enabled via maturin / default features)
pyo3 = { version = "0.27.2", features = ["abi3-py312"] }
pyo3-stub-gen = "0.22.4"

# Core rsmdu library
rsmdu = { path = "../rsmdu", default-features = true, features = ["rayon", "lidar-copc"] }

# GeoJSON for bindings
geojson = "0.24"

# Note: Polars DataFrame conversion will be handled via Python polars package
# We don't need polars with python feature here

