name: Release Python (Windows)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA
        type: string
      dry-run:
        description: Dry run
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.sha || github.sha }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install GDAL (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install maturin
        run: pip install maturin

      - name: Create source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >
            --manifest-path pymdurs/Cargo.toml
            --out dist
          maturin-version: 1.11.4

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    needs: [build-sdist]
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: "pip"

      - name: Install Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc
          rustup target add x86_64-pc-windows-msvc
          rustup default stable-x86_64-pc-windows-msvc

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ env.PYTHON_VERSION }}
          channels: conda-forge
          channel-priority: strict
          auto-activate-base: false

      - name: Install GDAL/GEOS/PROJ via Conda
        shell: pwsh
        run: |
          conda install -y -c conda-forge gdal libgdal geos proj sqlite

          $condaEnv = (conda info --json | ConvertFrom-Json).active_prefix
          $libRoot  = "$condaEnv\Library"
          $libDir   = "$libRoot\lib"
          $incDir   = "$libRoot\include"
          $binDir   = "$libRoot\bin"
          $pkgcfg   = "$libDir\pkgconfig"

          Write-Host "Active env : $condaEnv"

          # Créer gdal_i.lib depuis gdal.lib
          if (-not (Test-Path "$libDir\gdal_i.lib")) {
            if (Test-Path "$libDir\gdal.lib") {
              Copy-Item "$libDir\gdal.lib" "$libDir\gdal_i.lib"
              Write-Host "✅ gdal_i.lib created"
            } else {
              throw "Neither gdal_i.lib nor gdal.lib found"
            }
          }

          # Vérifier headers GDAL
          if (-not (Test-Path "$incDir\cpl_atomic_ops.h")) {
            throw "❌ GDAL headers not found in $incDir"
          }
          Write-Host "✅ GDAL headers OK"

          # Vérifier proj.pc
          Write-Host "=== pkgconfig files ==="
          Get-ChildItem "$pkgcfg" -ErrorAction SilentlyContinue

          # Récupérer les versions
          $geosVersion = (conda list geos --json | ConvertFrom-Json | Where-Object { $_.name -eq "geos" }).version
          $projVersion = (conda list proj --json | ConvertFrom-Json | Where-Object { $_.name -eq "proj" }).version
          Write-Host "GEOS version : $geosVersion"
          Write-Host "PROJ version : $projVersion"

          # Export toutes les variables
          "GDAL_HOME=$condaEnv"               | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_LIB_DIR=$libDir"              | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_INCLUDE_DIR=$incDir"          | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_VERSION=3"                    | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GEOS_LIB_DIR=$libDir"              | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GEOS_INCLUDE_DIR=$incDir"          | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GEOS_VERSION=$geosVersion"         | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_LIB=$libRoot\share\proj"      | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_LIB_DIR=$libDir"              | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_INCLUDE_DIR=$incDir"          | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_VERSION=$projVersion"         | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$pkgcfg"           | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUST_BACKTRACE=1"                  | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$binDir"                           | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: x86_64-pc-windows-msvc
          args: >
            --release
            --manifest-path pymdurs/Cargo.toml
            --out dist
          maturin-version: 1.11.4

      - name: Test wheel
        shell: bash
        run: |
          pip install --force-reinstall --verbose dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import pymdurs; print('pymdurs imported successfully')"
          python -c "import pymdurs; bbox = pymdurs.PyBoundingBox(-1.0, 46.0, 1.0, 47.0); print('PyBoundingBox works:', bbox.min_x)"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-x86_64
          path: dist/*.whl

  publish-to-pypi:
    needs: [build-sdist, build-wheels]
    environment:
      name: release-python
      url: https://pypi.org/project/pymdurs
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download sdists and wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        if: inputs.dry-run == false
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  publish-to-github:
    needs: [publish-to-pypi]
    if: inputs.dry-run == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Get version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m 1 -oP 'version = "\K[^"]+' pyproject.toml)
          if [[ "$VERSION" == *"-"* ]] || [[ "$VERSION" == *"dev"* ]] || [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"rc"* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          name: Python pymdurs ${{ steps.version.outputs.version }}
          tag_name: py-${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          files: dist/*
          body: |
            ## Python Package Release ${{ steps.version.outputs.version }}

            ### Installation
              ```bash
                          pip install pymdurs
              ```

            ### Available Classes
            - `pymdurs.geometric.Building` - Building data collection
            - `pymdurs.geometric.Dem` - Digital Elevation Model
            - `pymdurs.geometric.Cadastre` - Cadastral parcel data
            - `pymdurs.geometric.Iris` - IRIS statistical units
            - `pymdurs.geometric.Lcz` - Local Climate Zone
            - `pymdurs.BoundingBox` - Bounding box operations
            - `pymdurs.GeoCore` - CRS and geographic operations

            ### Requirements
            - Python >= 3.8
            - pandas >= 2.0.0
            - numpy < 2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
