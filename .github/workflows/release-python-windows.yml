name: Release Python (Windows)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA
        required: false
        type: string
      dry-run:
        description: Dry run
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  MATURIN_VERSION: "1.11.4"
  RUST_TARGET: "x86_64-pc-windows-msvc"
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: pwsh

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install maturin
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin==${{ env.MATURIN_VERSION }}"

      - name: Create source distribution
        run: |
          maturin sdist `
            --manifest-path pymdurs/Cargo.toml `
            --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-windows-wheel:
    name: Build Windows wheel
    needs: [build-sdist]
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: build-pymdurs
          python-version: ${{ env.PYTHON_VERSION }}
          channels: conda-forge
          channel-priority: strict
          mamba-version: "*"
          use-mamba: true

      - name: Install native dependencies
        run: |
          mamba install -y `
            gdal `
            libgdal `
            libclang

          python -m pip install --upgrade pip
          python -m pip install `
            "maturin==${{ env.MATURIN_VERSION }}" `
            delvewheel

      - name: Configure GDAL, PROJ and libclang paths
        run: |
          $gdalHome = "$env:CONDA_PREFIX\Library"
          $gdalBin = "$gdalHome\bin"
          $gdalInclude = "$gdalHome\include"
          $gdalLib = "$gdalHome\lib"
          $gdalData = "$gdalHome\share\gdal"
          $projData = "$gdalHome\share\proj"

          Add-Content -Path $env:GITHUB_ENV -Value "GDAL_HOME=$gdalHome"
          Add-Content -Path $env:GITHUB_ENV -Value "GDAL_INCLUDE_DIR=$gdalInclude"
          Add-Content -Path $env:GITHUB_ENV -Value "GDAL_LIB_DIR=$gdalLib"
          Add-Content -Path $env:GITHUB_ENV -Value "GDAL_DATA=$gdalData"
          Add-Content -Path $env:GITHUB_ENV -Value "PROJ_DATA=$projData"
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$gdalBin"
          Add-Content -Path $env:GITHUB_ENV -Value "INCLUDE=$gdalInclude;$env:INCLUDE"
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=$gdalLib;$env:LIB"

          Add-Content -Path $env:GITHUB_PATH -Value $gdalBin
          Add-Content -Path $env:GITHUB_PATH -Value "$env:CONDA_PREFIX\Scripts"
          Add-Content -Path $env:GITHUB_PATH -Value $env:CONDA_PREFIX

          $env:PATH = "$gdalBin;$env:CONDA_PREFIX\Scripts;$env:CONDA_PREFIX;$env:PATH"

          gdalinfo --version
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Show toolchain diagnostics
        run: |
          rustc --version
          cargo --version
          rustup target list --installed
          maturin --version

      - name: Build wheel
        run: |
          maturin build `
            --release `
            --target ${{ env.RUST_TARGET }} `
            --manifest-path pymdurs/Cargo.toml `
            --out dist

      - name: Repair Windows wheel with delvewheel
        run: |
          New-Item -ItemType Directory -Force -Path repaired | Out-Null

          $wheel = Get-ChildItem -Path dist -Filter "*.whl" | Select-Object -First 1

          if (-not $wheel) {
            throw "No wheel found in dist/"
          }

          python -m delvewheel show "$($wheel.FullName)"

          python -m delvewheel repair "$($wheel.FullName)" `
            --wheel-dir repaired `
            --add-path "$env:CONDA_PREFIX\Library\bin"

          Remove-Item -Path dist\*.whl -Force
          Copy-Item -Path repaired\*.whl -Destination dist -Force

          Get-ChildItem -Path dist

      - name: Test repaired wheel
        run: |
          $wheel = Get-ChildItem -Path dist -Filter "*.whl" | Select-Object -First 1

          if (-not $wheel) {
            throw "No repaired wheel found in dist/"
          }

          python -m pip install --force-reinstall --verbose "$($wheel.FullName)"

          $testDir = Join-Path $env:RUNNER_TEMP "pymdurs-wheel-test"
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          Set-Location $testDir

          python -c "import pymdurs; print('pymdurs imported successfully')"
          python -c "import pymdurs; print('Available classes:', [x for x in dir(pymdurs.geometric) if not x.startswith('_')])"
          python -c "import pymdurs; bbox = pymdurs.PyBoundingBox(-1.0, 46.0, 1.0, 47.0); print('PyBoundingBox works:', bbox.min_x)"

      - name: Upload Windows wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-x86_64
          path: dist/*.whl
          if-no-files-found: error

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build-sdist, build-windows-wheel]
    runs-on: ubuntu-latest
    environment:
      name: release-python
      url: https://pypi.org/project/pymdurs
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download sdists and wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List distributions
        run: |
          find dist -maxdepth 1 -type f -print

      - name: Publish to PyPI
        if: inputs.dry-run == false
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
          verbose: true

  publish-to-github:
    name: Publish GitHub release
    needs: [publish-to-pypi]
    if: inputs.dry-run == false
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Get version from pyproject.toml
        id: version
        shell: bash
        run: |
          VERSION=$(grep -m 1 -oP 'version = "\K[^"]+' pyproject.toml)

          if [[ -z "$VERSION" ]]; then
            echo "Unable to extract version from pyproject.toml"
            exit 1
          fi

          if [[ "$VERSION" == *"-"* ]] || [[ "$VERSION" == *"dev"* ]] || [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"rc"* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release artifacts
        run: |
          find dist -maxdepth 1 -type f -print

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Python pymdurs ${{ steps.version.outputs.version }}
          tag_name: py-${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            ## Python Package Release ${{ steps.version.outputs.version }}

            This release includes Python bindings for pymdurs.

            ### Installation

            ```bash
            pip install pymdurs
            ```

            ### Windows wheel

            This release includes a Windows x86_64 wheel built with:

            - Python ${{ env.PYTHON_VERSION }}
            - Rust target `${{ env.RUST_TARGET }}`
            - GDAL from conda-forge
            - DLL repair via `delvewheel`

            ### Available Classes

            - `pymdurs.geometric.Building` - Building data collection
            - `pymdurs.geometric.Dem` - Digital Elevation Model
            - `pymdurs.geometric.Cadastre` - Cadastral parcel data
            - `pymdurs.geometric.Iris` - IRIS statistical units
            - `pymdurs.geometric.Lcz` - Local Climate Zone
            - `pymdurs.BoundingBox` - Bounding box operations
            - `pymdurs.GeoCore` - CRS and geographic operations

            ### Requirements

            - Python >= 3.8
            - pandas >= 2.0.0
            - numpy < 2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}