name: Release Python (Windows)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA
        type: string
      dry-run:
        description: Dry run
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.sha || github.sha }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  CARGO_HOME: C:\cargo
  CARGO_TARGET_DIR: C:\target

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # 1. Source distribution (Linux)
  # ---------------------------------------------------------------------------
  build-sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install GDAL (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install maturin
        run: pip install maturin

      - name: Create source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >
            --manifest-path pymdurs/Cargo.toml
            --out dist
          maturin-version: 1.11.4

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ---------------------------------------------------------------------------
  # 2. Windows wheel
  #
  # Fork AlexanderWillner conserve (GDAL 3.13 compat).
  # Le submodule OSGeo/gdal est fetche par cargo pour les headers C — normal.
  # On link contre le GDAL conda (pas une compilation depuis les sources).
  #
  # Probleme MSVC : le fork utilise u32 pour OGRErr/GDALDataType/etc.
  # MSVC bindgen genere i32 pour les enums C → erreurs de types.
  # Fix : patch Python sur srs.rs + types.rs + rasterband.rs apres cargo fetch.
  # ---------------------------------------------------------------------------
  build-wheels:
    needs: [build-sdist]
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force `
            -ErrorAction SilentlyContinue | Out-Null
          New-Item -ItemType Directory -Force -Path $env:CARGO_HOME | Out-Null

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ env.PYTHON_VERSION }}
          channels: conda-forge
          channel-priority: strict
          activate-environment: true

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: conda-${{ runner.os }}-geo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: conda-${{ runner.os }}-geo-

      - name: Install GDAL, GEOS, PROJ via Conda
        shell: pwsh
        run: |
          conda install -c conda-forge libgdal geos proj sqlite pkg-config --yes
          $prefix = (conda info --json | ConvertFrom-Json).active_prefix
          $lib    = "$prefix\Library"
          $gdalDll = Get-ChildItem "$lib\bin" -Filter "gdal*.dll"   | Sort-Object Name | Select-Object -First 1
          $projDll = Get-ChildItem "$lib\bin" -Filter "proj*.dll"   | Sort-Object Name | Select-Object -First 1
          $geosDll = Get-ChildItem "$lib\bin" -Filter "geos_c*.dll" | Sort-Object Name | Select-Object -First 1
          if (-not $gdalDll) { Write-Error "gdal*.dll introuvable" ; exit 1 }
          if (-not $projDll) { Write-Error "proj*.dll introuvable" ; exit 1 }
          if (-not $geosDll) { Write-Error "geos_c*.dll introuvable" ; exit 1 }
          $geosVer = ((conda list geos)   | Select-String "^geos\s+").ToString().Trim()    -split "\s+" | Select-Object -Index 1
          $projVer = ((conda list proj)   | Select-String "^proj\s+").ToString().Trim()    -split "\s+" | Select-Object -Index 1
          $gdalVer = ((conda list libgdal)| Select-String "^libgdal\s+").ToString().Trim() -split "\s+" | Select-Object -Index 1
          Write-Host "GDAL $gdalVer  GEOS $geosVer  PROJ $projVer"
          "CONDA_LIB=$lib"                 | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_DLL_NAME=$($gdalDll.Name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_DLL_NAME=$($projDll.Name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GEOS_DLL_NAME=$($geosDll.Name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_VERSION_FULL=$gdalVer"     | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GEOS_VERSION=$geosVer"          | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_VERSION=$projVer"          | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_HOME=$lib"                 | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_LIB_DIR=$lib\lib"          | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_INCLUDE_DIR=$lib\include"  | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GEOS_LIB_DIR=$lib\lib"          | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_LIB=$lib\share\proj"       | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_DATA=$lib\share\proj"      | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_ROOT=$lib"                 | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RUST_BACKTRACE=full"            | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "$lib\bin"                       | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate MSVC import libraries
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcVer   = Get-ChildItem "$vsPath\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1
          $msvc    = "$($vcVer.FullName)\bin\Hostx64\x64"
          function New-ImportLib($DllPath, $LibPath) {
            $dll = Split-Path $DllPath -Leaf
            $def = "$env:TEMP\$([IO.Path]::GetFileNameWithoutExtension($dll)).def"
            $exp = & "$msvc\dumpbin.exe" /exports $DllPath
            $sym = $exp | Select-String -Pattern "^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)" |
                   ForEach-Object { $_.Matches[0].Groups[1].Value }
            if ($sym.Count -eq 0) { Write-Warning "Aucun export: $dll" ; return }
            "LIBRARY $dll" | Out-File $def -Encoding ascii
            "EXPORTS"       | Out-File $def -Encoding ascii -Append
            $sym            | Out-File $def -Encoding ascii -Append
            & "$msvc\lib.exe" /def:$def /out:$LibPath /machine:x64 | Out-Null
            Write-Host "  $(Split-Path $LibPath -Leaf) OK"
          }
          New-ImportLib "$env:CONDA_LIB\bin\$env:GDAL_DLL_NAME" "$env:CONDA_LIB\lib\gdal_i.lib"
          New-ImportLib "$env:CONDA_LIB\bin\$env:PROJ_DLL_NAME" "$env:CONDA_LIB\lib\proj_i.lib"
          Copy-Item "$env:CONDA_LIB\lib\proj_i.lib" "$env:CONDA_LIB\lib\proj.lib" -Force
          New-ImportLib "$env:CONDA_LIB\bin\$env:GEOS_DLL_NAME" "$env:CONDA_LIB\lib\geos_c.lib"

      - name: Write pkg-config .pc files
        shell: pwsh
        run: |
          $pcDir = "$env:CONDA_LIB\lib\pkgconfig"
          New-Item -ItemType Directory -Force -Path $pcDir | Out-Null
          $pfx = $env:CONDA_LIB -replace "\\","/"
          @("prefix=$pfx","exec_prefix=`${prefix}","libdir=`${prefix}/lib","includedir=`${prefix}/include","",
            "Name: GDAL","Description: Geospatial Data Abstraction Library","Version: $env:GDAL_VERSION_FULL",
            "Libs: -L`${libdir} -lgdal_i","Cflags: -I`${includedir}"
          ) | Set-Content "$pcDir\gdal.pc" -Encoding ascii
          @("prefix=$pfx","exec_prefix=`${prefix}","libdir=`${prefix}/lib","includedir=`${prefix}/include","",
            "Name: PROJ","Description: Coordinate transformation library","Version: $env:PROJ_VERSION",
            "Libs: -L`${libdir} -lproj_i","Cflags: -I`${includedir}"
          ) | Set-Content "$pcDir\proj.pc" -Encoding ascii
          "PKG_CONFIG_PATH=$pcDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set LIBCLANG_PATH
        shell: pwsh
        run: |
          $found = $null
          foreach ($c in @("C:\Program Files\LLVM\bin","C:\LLVM\bin")) {
            if (Test-Path "$c\libclang.dll") { $found = $c ; break }
          }
          if (-not $found) {
            $dll = Get-ChildItem "C:\Program Files" -Recurse -Filter "libclang.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($dll) { $found = Split-Path $dll.FullName }
          }
          if (-not $found) {
            choco install llvm --version=18.1.8 -y --no-progress
            $found = "C:\Program Files\LLVM\bin"
          }
          "LIBCLANG_PATH=$found" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "LIBCLANG_PATH=$found"

      - name: Install Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc
          rustup target add x86_64-pc-windows-msvc
          rustup default stable-x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            C:\cargo\registry
            C:\cargo\git
            C:\target
          key: cargo-${{ runner.os }}-msvc-fork-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-msvc-fork-

      - name: Install maturin
        shell: pwsh
        run: pip install maturin

      # ── Fetch fork + patch MSVC ──────────────────────────────────────────────
      # Le fork utilise u32 pour les enums GDAL, MSVC bindgen genere i32.
      # On patche via un script Python (evite les problemes YAML/heredoc).
      # Fichiers patches : srs.rs, types.rs, rasterband.rs
      # Corrections :
      #   1. err_code u32 -> OGRErr::Type (i32 MSVC / u32 Linux)
      #   2. *mut u32 pointer casts -> suppression (type infere)
      #   3. OAMS match arms -> guards "x if x == CONST as u32"
      #   4. TryFrom<i32> pour AxisMappingStrategy et GdalDataType
      #   5. enum discriminants u32 -> casts "as u32" dans rasterband.rs
      - name: Fetch gdal fork and patch for Windows MSVC
        shell: pwsh
        env:
          GDAL_HOME: ${{ env.GDAL_HOME }}
          GDAL_LIB_DIR: ${{ env.GDAL_LIB_DIR }}
          GDAL_INCLUDE_DIR: ${{ env.GDAL_INCLUDE_DIR }}
          GEOS_LIB_DIR: ${{ env.GEOS_LIB_DIR }}
          PROJ_LIB: ${{ env.PROJ_LIB }}
          PKG_CONFIG_PATH: ${{ env.PKG_CONFIG_PATH }}
          LIBCLANG_PATH: ${{ env.LIBCLANG_PATH }}
        run: |
          Write-Host "Fetch fork gdal (inclut submodule OSGeo/gdal pour headers C)..."
          cargo fetch --manifest-path pymdurs/Cargo.toml 2>&1 |
            Select-String -Pattern "gdal|Fetch|error" | ForEach-Object { Write-Host $_ }

          # Localise le checkout du fork
          $base = "$env:CARGO_HOME\git\checkouts"
          $gdalCheckout = Get-ChildItem $base -Directory | Where-Object { $_.Name -match "^gdal-" } | Select-Object -First 1
          if (-not $gdalCheckout) { Write-Error "Checkout gdal introuvable" ; exit 1 }
          $srcDir = (Get-ChildItem $gdalCheckout.FullName -Directory | Select-Object -First 1).FullName
          Write-Host "Fork src : $srcDir"

          # Ecrit le script Python dans un fichier temp (evite les problemes de
          # caracteres speciaux et de heredocs imbriques dans le YAML)
          $py = @(
            "import os, re",
            "src = r'$srcDir'",
            "",
            "def patch(path, guard, transforms, appends):",
            "    if not os.path.exists(path): print('SKIP:', path); return",
            "    with open(path, encoding='utf-8') as f: c = f.read()",
            "    if guard and guard in c: print('Already patched:', path); return",
            "    for pat, rep, fl in transforms: c = re.sub(pat, rep, c, flags=fl)",
            "    for line in appends: c += line + chr(10)",
            "    with open(path, 'w', encoding='utf-8') as f: f.write(c)",
            "    print('Patched:', path)",
            "",
            "# srs.rs : err_code types + OAMS match + TryFrom<i32>",
            "patch(os.path.join(src, 'src', 'spatial_ref', 'srs.rs'),",
            "    'OGRErr::Type',",
            "    [",
            "        (r'let mut err_code:\s*u32\b', 'let mut err_code: gdal_sys::OGRErr::Type', 0),",
            "        (r'&mut err_code as \*mut u32\b', '&mut err_code', 0),",
            r"        (r'^(\s+)(OAMS_TRADITIONAL_GIS_ORDER)(\s*=>)', r'\1x_tgo if x_tgo == \2 as u32\3', re.M),",
            r"        (r'^(\s+)(OAMS_AUTHORITY_COMPLIANT)(\s*=>)',   r'\1x_ac if x_ac == \2 as u32\3',   re.M),",
            r"        (r'^(\s+)(OAMS_CUSTOM)(\s*=>)',                r'\1x_cu if x_cu == \2 as u32\3',   re.M),",
            "    ],",
            "    [",
            "        '/// MSVC compat added by CI patch',",
            "        '#[cfg(target_env = \"msvc\")]',",
            "        'impl TryFrom<i32> for AxisMappingStrategy {',",
            "        '    type Error = <AxisMappingStrategy as TryFrom<u32>>::Error;',",
            "        '    fn try_from(v: i32) -> Result<Self, Self::Error> { Self::try_from(v as u32) }',",
            "        '}',",
            "    ]",
            ")",
            "",
            "# types.rs : TryFrom<i32> pour GdalDataType",
            "patch(os.path.join(src, 'src', 'raster', 'types.rs'),",
            "    'TryFrom<i32> for GdalDataType',",
            "    [],",
            "    [",
            "        '/// MSVC compat added by CI patch',",
            "        '#[cfg(target_env = \"msvc\")]',",
            "        'impl TryFrom<i32> for GdalDataType {',",
            "        '    type Error = <GdalDataType as TryFrom<u32>>::Error;',",
            "        '    fn try_from(v: i32) -> Result<Self, Self::Error> { Self::try_from(v as u32) }',",
            "        '}',",
            "    ]",
            ")",
            "",
            "# rasterband.rs : discriminants d'enum u32 vs constantes i32",
            "# Pattern: EnumVariant = GDALRIOResampleAlg::GRIORA_X, -> = GDALRIOResampleAlg::GRIORA_X as u32,",
            "patch(os.path.join(src, 'src', 'raster', 'rasterband.rs'),",
            "    'GRIORA_NearestNeighbour as u32',",
            "    [",
            r"        (r'(GDALRIOResampleAlg::\w+)(?=\s*[,}])', r'\1 as u32', 0),",
            "    ],",
            "    []",
            ")",
            "",
            "print('All patches done')"
          )
          $py | Set-Content "$env:TEMP\patch_gdal.py" -Encoding utf8
          python "$env:TEMP\patch_gdal.py"

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build wheel
        shell: pwsh
        env:
          GDAL_HOME: ${{ env.GDAL_HOME }}
          GDAL_LIB_DIR: ${{ env.GDAL_LIB_DIR }}
          GDAL_INCLUDE_DIR: ${{ env.GDAL_INCLUDE_DIR }}
          GEOS_LIB_DIR: ${{ env.GEOS_LIB_DIR }}
          GEOS_VERSION: ${{ env.GEOS_VERSION }}
          PROJ_LIB: ${{ env.PROJ_LIB }}
          PROJ_DATA: ${{ env.PROJ_DATA }}
          PROJ_ROOT: ${{ env.PROJ_ROOT }}
          PKG_CONFIG_PATH: ${{ env.PKG_CONFIG_PATH }}
          LIBCLANG_PATH: ${{ env.LIBCLANG_PATH }}
          RUST_BACKTRACE: full
        run: |
          maturin build `
            --release `
            --target x86_64-pc-windows-msvc `
            --manifest-path pymdurs/Cargo.toml `
            --out dist

      - name: Test wheel
        shell: pwsh
        run: |
          pip install --force-reinstall --verbose (Get-Item dist\*.whl)
          Push-Location $env:TEMP
          try {
            python -c "import pymdurs; print('pymdurs imported successfully')"
            python -c "import pymdurs; bbox = pymdurs.PyBoundingBox(-1.0, 46.0, 1.0, 47.0); print('PyBoundingBox works: min_x =', bbox.min_x)"
          } finally { Pop-Location }

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-x86_64
          path: dist/*.whl

  # ---------------------------------------------------------------------------
  # 3. Publication PyPI
  # ---------------------------------------------------------------------------
  publish-to-pypi:
    needs: [build-sdist, build-wheels]
    environment:
      name: release-python
      url: https://pypi.org/project/pymdurs
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download sdists and wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        if: inputs.dry-run == false
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  # ---------------------------------------------------------------------------
  # 4. Publication GitHub Release
  # ---------------------------------------------------------------------------
  publish-to-github:
    needs: [publish-to-pypi]
    if: inputs.dry-run == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - name: Get version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m 1 -oP 'version = "\K[^"]+' pyproject.toml)
          if [[ "$VERSION" == *"-"* ]] || [[ "$VERSION" == *"dev"* ]] || [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"rc"* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "version=$VERSION"             >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          name: Python pymdurs ${{ steps.version.outputs.version }}
          tag_name: py-${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          files: dist/*
          body: |
            ## Python Package Release ${{ steps.version.outputs.version }}

            ### Installation
            ```bash
            pip install pymdurs
            ```

            ### Available Classes

            - `pymdurs.geometric.Building` - Building data collection
            - `pymdurs.geometric.Dem` - Digital Elevation Model
            - `pymdurs.geometric.Cadastre` - Cadastral parcel data
            - `pymdurs.geometric.Iris` - IRIS statistical units
            - `pymdurs.geometric.Lcz` - Local Climate Zone
            - `pymdurs.BoundingBox` - Bounding box operations
            - `pymdurs.GeoCore` - CRS and geographic operations

            ### Changes

            See the [changelog](https://github.com/rupeelab17/pymdurs/blob/main/CHANGELOG.md) for details.

            ### Requirements

            - Python >= 3.8
            - pandas >= 2.0.0
            - numpy < 2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}