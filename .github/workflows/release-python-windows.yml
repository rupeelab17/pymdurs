name: Release Python (Windows)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA
        type: string
      dry-run:
        description: Dry run
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.sha || github.sha }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Shorter paths avoid Windows MAX_PATH when cargo fetches git deps
  CARGO_HOME: C:\cargo
  CARGO_TARGET_DIR: C:\target

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # 1. Source distribution (Linux, inchangé)
  # ---------------------------------------------------------------------------
  build-sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install GDAL (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install maturin
        run: pip install maturin

      - name: Create source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >
            --manifest-path pymdurs/Cargo.toml
            --out dist
          maturin-version: 1.11.4

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ---------------------------------------------------------------------------
  # 2. Windows wheel — tout en MSVC, un seul environnement Python (conda)
  # ---------------------------------------------------------------------------
  build-wheels:
    needs: [build-sdist]
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Enable Windows long paths for git/cargo
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force `
            -ErrorAction SilentlyContinue | Out-Null
          New-Item -ItemType Directory -Force -Path $env:CARGO_HOME | Out-Null
          # gdal git fork pulls gdal-src submodule with paths > MAX_PATH; use crates.io on Windows
          @"
          [patch.'git+https://github.com/AlexanderWillner/gdal.git?branch=fix%2Fgdal-3.13-compat']
          gdal = { version = "0.19", features = ["bindgen"] }
          "@ | Set-Content -Path "$env:CARGO_HOME\config.toml" -Encoding utf8

      # ── Conda (fournit Python + GDAL + GEOS + PROJ compilés MSVC) ──────────
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ env.PYTHON_VERSION }}
          channels: conda-forge
          channel-priority: strict
          # On active l'env "base" pour que conda run et pip pointent au même endroit
          activate-environment: true

      # Cache conda pour éviter de re-télécharger 500 MB à chaque run
      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: conda-${{ runner.os }}-gdal-${{ hashFiles('**/environment*.yml', '**/Cargo.toml') }}
          restore-keys: conda-${{ runner.os }}-gdal-

      - name: Install GDAL, GEOS, PROJ via Conda (MSVC builds)
        shell: pwsh
        run: |
          # conda-forge fournit des builds MSVC natifs pour Windows
          conda install -c conda-forge libgdal geos proj sqlite --yes

          $prefix = (conda info --json | ConvertFrom-Json).active_prefix
          $lib    = "$prefix\Library"

          Write-Host "Active conda prefix : $prefix"
          Write-Host "Library path        : $lib"

          # Vérification des headers GDAL
          $header = Get-ChildItem "$lib\include" -Filter "gdal.h" -ErrorAction SilentlyContinue
          if ($header) {
            Write-Host "✅ gdal.h trouvé : $($header.FullName)"
          } else {
            Write-Error "❌ gdal.h introuvable — installation GDAL défaillante"
            exit 1
          }

          # Récupération version GEOS depuis conda list
          $geosLine = (conda list geos) | Select-String -Pattern "^geos\s+"
          if (-not $geosLine) { Write-Error "GEOS absent de l'env conda" ; exit 1 }
          $geosVer = ($geosLine.ToString().Trim() -split "\s+")[1]
          Write-Host "GEOS version : $geosVer"

          # Export des variables d'environnement pour les steps suivants
          "CONDA_PREFIX=$prefix"           | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GEOS_VERSION=$geosVer"          | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_HOME=$lib"                 | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_LIB_DIR=$lib\lib"          | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_INCLUDE_DIR=$lib\include"  | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_VERSION=3"                 | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GEOS_LIB_DIR=$lib\lib"          | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_LIB=$lib\share\proj"       | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_DATA=$lib\share\proj"      | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RUST_BACKTRACE=1"               | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          # On ajoute les DLL conda au PATH (MSVC runtime + gdal/geos/proj)
          "$lib\bin"                       | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      # ── Rust MSVC (compatible avec le Python MSVC de conda-forge) ──────────
      - name: Install Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc
          rustup target add x86_64-pc-windows-msvc
          rustup default stable-x86_64-pc-windows-msvc
          rustup show

      # Cache cargo registry/git pour accélérer les builds suivants
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            C:\cargo\registry
            C:\cargo\git
            C:\target
          key: cargo-${{ runner.os }}-msvc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-msvc-

      # ── maturin installé dans l'env conda (même Python que le wheel) ───────
      - name: Install maturin
        shell: pwsh
        run: pip install maturin

      # ── Build du wheel en MSVC ──────────────────────────────────────────────
      # On n'utilise PAS maturin-action car elle ne propage pas les env vars
      # du runner de façon fiable sur Windows.
      - name: Build wheel (maturin direct)
        shell: pwsh
        env:
          GDAL_HOME: ${{ env.GDAL_HOME }}
          GDAL_LIB_DIR: ${{ env.GDAL_LIB_DIR }}
          GDAL_INCLUDE_DIR: ${{ env.GDAL_INCLUDE_DIR }}
          GDAL_VERSION: ${{ env.GDAL_VERSION }}
          GEOS_LIB_DIR: ${{ env.GEOS_LIB_DIR }}
          GEOS_VERSION: ${{ env.GEOS_VERSION }}
          PROJ_LIB: ${{ env.PROJ_LIB }}
          PROJ_DATA: ${{ env.PROJ_DATA }}
          RUST_BACKTRACE: 1
        run: |
          maturin build `
            --release `
            --target x86_64-pc-windows-msvc `
            --manifest-path pymdurs/Cargo.toml `
            --out dist

      # ── Test du wheel dans le même env (PATH conda actif) ──────────────────
      - name: Test wheel
        shell: pwsh
        run: |
          # Installation forcée du wheel fraîchement buildé
          pip install --force-reinstall --verbose (Get-Item dist\*.whl)

          # Test depuis un répertoire neutre (pas le source tree)
          Push-Location $env:TEMP
          try {
            python -c "import pymdurs; print('✅ pymdurs imported successfully')"
            python -c "
          import pymdurs
          bbox = pymdurs.PyBoundingBox(-1.0, 46.0, 1.0, 47.0)
          print('✅ PyBoundingBox works: min_x =', bbox.min_x)
          "
          } finally {
            Pop-Location
          }

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-x86_64
          path: dist/*.whl

  # ---------------------------------------------------------------------------
  # 3. Publication PyPI (inchangé)
  # ---------------------------------------------------------------------------
  publish-to-pypi:
    needs: [build-sdist, build-wheels]
    environment:
      name: release-python
      url: https://pypi.org/project/pymdurs
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download sdists and wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        if: inputs.dry-run == false
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  # ---------------------------------------------------------------------------
  # 4. Publication GitHub Release (inchangé sauf clarification version)
  # ---------------------------------------------------------------------------
  publish-to-github:
    needs: [publish-to-pypi]
    if: inputs.dry-run == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Get version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m 1 -oP 'version = "\K[^"]+' pyproject.toml)
          if [[ "$VERSION" == *"-"* ]] || \
             [[ "$VERSION" == *"dev"* ]] || \
             [[ "$VERSION" == *"alpha"* ]] || \
             [[ "$VERSION" == *"beta"* ]] || \
             [[ "$VERSION" == *"rc"* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "version=$VERSION"           >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          name: Python pymdurs ${{ steps.version.outputs.version }}
          tag_name: py-${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          files: dist/*
          body: |
            ## Python Package Release ${{ steps.version.outputs.version }}

            ### Installation
            ```bash
            pip install pymdurs
            ```

            ### Available Classes

            - `pymdurs.geometric.Building` - Building data collection
            - `pymdurs.geometric.Dem` - Digital Elevation Model
            - `pymdurs.geometric.Cadastre` - Cadastral parcel data
            - `pymdurs.geometric.Iris` - IRIS statistical units
            - `pymdurs.geometric.Lcz` - Local Climate Zone
            - `pymdurs.BoundingBox` - Bounding box operations
            - `pymdurs.GeoCore` - CRS and geographic operations

            ### Changes

            See the [changelog](https://github.com/rupeelab17/pymdurs/blob/main/CHANGELOG.md) for details.

            ### Requirements

            - Python >= 3.8
            - pandas >= 2.0.0
            - numpy < 2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}