name: Release Python (Windows)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA
        type: string
      dry-run:
        description: Dry run
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.sha || github.sha }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  CARGO_HOME: C:\cargo
  CARGO_TARGET_DIR: C:\target

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # 1. Source distribution (Linux, inchangé)
  # ---------------------------------------------------------------------------
  build-sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install GDAL (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install maturin
        run: pip install maturin

      - name: Create source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >
            --manifest-path pymdurs/Cargo.toml
            --out dist
          maturin-version: 1.11.4

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ---------------------------------------------------------------------------
  # 2. Windows wheel
  # ---------------------------------------------------------------------------
  build-wheels:
    needs: [build-sdist]
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force `
            -ErrorAction SilentlyContinue | Out-Null
          New-Item -ItemType Directory -Force -Path $env:CARGO_HOME | Out-Null

      # ── Conda : Python + GDAL 3.12 + GEOS + PROJ ───────────────────────────
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ env.PYTHON_VERSION }}
          channels: conda-forge
          channel-priority: strict
          activate-environment: true

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: conda-${{ runner.os }}-gdal312-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: conda-${{ runner.os }}-gdal312-

      - name: Install GDAL, GEOS, PROJ via Conda
        shell: pwsh
        run: |
          # Le fork AlexanderWillner/gdal supporte GDAL 3.13 — pas de contrainte de version
          conda install -c conda-forge libgdal geos proj sqlite pkg-config --yes

          $prefix = (conda info --json | ConvertFrom-Json).active_prefix
          $lib    = "$prefix\Library"

          Write-Host "Active conda prefix : $prefix"
          Write-Host "Library             : $lib"

          # Vérification DLL GDAL
          $gdalDll = Get-ChildItem "$lib\bin" -Filter "gdal*.dll" |
                     Sort-Object Name | Select-Object -First 1
          if (-not $gdalDll) {
            Write-Error "gdal*.dll introuvable dans $lib\bin" ; exit 1
          }
          Write-Host "GDAL DLL : $($gdalDll.Name)"

          # Vérification DLL PROJ
          $projDll = Get-ChildItem "$lib\bin" -Filter "proj*.dll" |
                     Sort-Object Name | Select-Object -First 1
          if (-not $projDll) {
            Write-Error "proj*.dll introuvable dans $lib\bin" ; exit 1
          }
          Write-Host "PROJ DLL : $($projDll.Name)"

          # Versions
          $geosVer = ((conda list geos) | Select-String "^geos\s+").ToString().Trim() -split "\s+" | Select-Object -Index 1
          $projVer = ((conda list proj) | Select-String "^proj\s+").ToString().Trim() -split "\s+" | Select-Object -Index 1
          Write-Host "GEOS $geosVer  PROJ $projVer"

          # Export
          "CONDA_PREFIX=$prefix"            | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CONDA_LIB=$lib"                  | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_DLL_NAME=$($gdalDll.Name)"  | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_DLL_NAME=$($projDll.Name)"  | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GEOS_VERSION=$geosVer"           | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_VERSION=$projVer"           | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_HOME=$lib"                  | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_LIB_DIR=$lib\lib"           | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_INCLUDE_DIR=$lib\include"   | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          # Version complète pour pkg-config .pc et logs — NE PAS exporter GDAL_VERSION
          # car gdal-sys (fork) détecte la version via bindgen lui-même.
          # Si GDAL_VERSION est défini, gdal-sys le lit et peut échouer sur les types i32/u32.
          $gdalVer = ((conda list libgdal) | Select-String "^libgdal\s+").ToString().Trim() -split "\s+" | Select-Object -Index 1
          Write-Host "GDAL version installee : $gdalVer"
          # On exporte pour les .pc pkgconfig uniquement (variable locale au step)
          "GDAL_VERSION_FULL=$gdalVer"        | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GEOS_LIB_DIR=$lib\lib"           | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_LIB=$lib\share\proj"        | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_DATA=$lib\share\proj"       | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_ROOT=$lib"                  | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RUST_BACKTRACE=full"             | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          # pkg-config fourni par conda
          "$lib\bin"                        | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "$prefix\bin"                     | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      # ── Génération des import libraries MSVC (.lib) depuis les DLLs conda ──
      # conda-forge Windows ne livre pas les .lib MSVC — on les génère avec
      # dumpbin (export table) + lib.exe (import lib). Les deux outils sont
      # toujours présents sur windows-latest via Visual Studio Build Tools.
      - name: Generate MSVC import libraries (gdal_i.lib + proj_i.lib + geos_c.lib)
        shell: pwsh
        run: |
          # Localise les outils MSVC
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -products * `
                       -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                       -property installationPath
          if (-not $vsPath) { Write-Error "Visual Studio introuvable" ; exit 1 }

          $vcVer   = Get-ChildItem "$vsPath\VC\Tools\MSVC" |
                     Sort-Object Name -Descending | Select-Object -First 1
          $binDir  = "$($vcVer.FullName)\bin\Hostx64\x64"
          $dumpbin = "$binDir\dumpbin.exe"
          $libExe  = "$binDir\lib.exe"
          Write-Host "Outils MSVC : $binDir"

          function New-ImportLib {
            param($DllPath, $LibPath)
            $dllName = Split-Path $DllPath -Leaf
            $defPath = "$env:TEMP\$([System.IO.Path]::GetFileNameWithoutExtension($dllName)).def"

            Write-Host "`n── $dllName ──"
            $exports = & $dumpbin /exports $DllPath
            if ($LASTEXITCODE -ne 0) { Write-Error "dumpbin échoué pour $dllName" ; exit 1 }

            # Parse : lignes "   N   hint   RVA   name"
            $symbols = $exports |
              Select-String -Pattern "^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)" |
              ForEach-Object { $_.Matches[0].Groups[1].Value }

            if ($symbols.Count -eq 0) {
              Write-Warning "Aucun export dans $dllName — librairie ignorée"
              return
            }
            Write-Host "  $($symbols.Count) symboles exportés"

            "LIBRARY $dllName" | Out-File $defPath -Encoding ascii
            "EXPORTS"           | Out-File $defPath -Encoding ascii -Append
            $symbols            | Out-File $defPath -Encoding ascii -Append

            & $libExe /def:$defPath /out:$LibPath /machine:x64 | Out-Null
            if ($LASTEXITCODE -ne 0) { Write-Error "lib.exe échoué pour $dllName" ; exit 1 }

            $sz = (Get-Item $LibPath).Length
            Write-Host "  ✅ $LibPath ($sz bytes)"
          }

          $binDir2 = "$env:CONDA_LIB\bin"
          $libDir  = "$env:CONDA_LIB\lib"

          # GDAL
          New-ImportLib "$binDir2\$env:GDAL_DLL_NAME" "$libDir\gdal_i.lib"

          # PROJ — proj-sys cherche proj_i.lib ou proj.lib
          New-ImportLib "$binDir2\$env:PROJ_DLL_NAME" "$libDir\proj_i.lib"
          Copy-Item "$libDir\proj_i.lib" "$libDir\proj.lib" -Force

          # GEOS — geos-sys cherche geos_c.lib
          $geosDll = Get-ChildItem $binDir2 -Filter "geos_c*.dll" |
                     Sort-Object Name | Select-Object -First 1
          if ($geosDll) {
            New-ImportLib $geosDll.FullName "$libDir\geos_c.lib"
          }

          # Vérification finale
          Write-Host "`n── Vérification ──"
          @("gdal_i.lib","proj_i.lib","proj.lib","geos_c.lib") | ForEach-Object {
            $p = "$libDir\$_"
            if (Test-Path $p) { Write-Host "  ✅ $_" }
            else              { Write-Warning "  ⚠ $_ absent" }
          }

      # ── Configuration pkg-config pour proj-sys ──────────────────────────────
      # proj-sys 0.27 tente pkg-config avant les env vars sur Windows MSVC.
      # On écrit un .pc minimal pour que pkg-config trouve PROJ sans erreur.
      - name: Write pkg-config .pc files for PROJ and GDAL
        shell: pwsh
        run: |
          $pcDir = "$env:CONDA_LIB\lib\pkgconfig"
          New-Item -ItemType Directory -Force -Path $pcDir | Out-Null

          $pfx = $env:CONDA_LIB -replace '\\','/'

          # proj.pc — écriture ligne par ligne pour éviter les here-strings
          $projPc = @(
            "prefix=$pfx",
            'exec_prefix=${prefix}',
            'libdir=${prefix}/lib',
            'includedir=${prefix}/include',
            '',
            'Name: PROJ',
            'Description: Coordinate transformation library',
            "Version: $env:PROJ_VERSION",
            'Libs: -L${libdir} -lproj_i',
            'Cflags: -I${includedir}'
          )
          $projPc | Set-Content "$pcDir\proj.pc" -Encoding ascii

          # gdal.pc
          $gdalPc = @(
            "prefix=$pfx",
            'exec_prefix=${prefix}',
            'libdir=${prefix}/lib',
            'includedir=${prefix}/include',
            '',
            'Name: GDAL',
            'Description: Geospatial Data Abstraction Library',
            "Version: $env:GDAL_VERSION_FULL",
            'Libs: -L${libdir} -lgdal_i',
            'Cflags: -I${includedir}'
          )
          $gdalPc | Set-Content "$pcDir\gdal.pc" -Encoding ascii

          "PKG_CONFIG_PATH=$pcDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "pkg-config .pc ecrits dans $pcDir"
          Get-Content "$pcDir\proj.pc"

      # ── Rust MSVC ───────────────────────────────────────────────────────────
      - name: Install Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc
          rustup target add x86_64-pc-windows-msvc
          rustup default stable-x86_64-pc-windows-msvc
          rustup show

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            C:\cargo\registry
            C:\cargo\git
            C:\target
          key: cargo-${{ runner.os }}-msvc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-msvc-

      - name: Install maturin
        shell: pwsh
        run: pip install maturin

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build wheel (maturin direct)
        shell: pwsh
        env:
          GDAL_HOME: ${{ env.GDAL_HOME }}
          GDAL_LIB_DIR: ${{ env.GDAL_LIB_DIR }}
          GDAL_INCLUDE_DIR: ${{ env.GDAL_INCLUDE_DIR }}
          # GDAL_VERSION intentionnellement absent — le fork gdal-sys détecte via bindgen
          GEOS_LIB_DIR: ${{ env.GEOS_LIB_DIR }}
          GEOS_VERSION: ${{ env.GEOS_VERSION }}
          PROJ_LIB: ${{ env.PROJ_LIB }}
          PROJ_DATA: ${{ env.PROJ_DATA }}
          PROJ_ROOT: ${{ env.PROJ_ROOT }}
          PKG_CONFIG_PATH: ${{ env.PKG_CONFIG_PATH }}
          RUST_BACKTRACE: full
        run: |
          maturin build `
            --release `
            --target x86_64-pc-windows-msvc `
            --manifest-path pymdurs/Cargo.toml `
            --out dist

      # ── Test ─────────────────────────────────────────────────────────────────
      - name: Test wheel
        shell: pwsh
        run: |
          pip install --force-reinstall --verbose (Get-Item dist\*.whl)
          Push-Location $env:TEMP
          try {
            python -c "import pymdurs; print('✅ pymdurs imported successfully')"
            python -c "
          import pymdurs
          bbox = pymdurs.PyBoundingBox(-1.0, 46.0, 1.0, 47.0)
          print('✅ PyBoundingBox works: min_x =', bbox.min_x)
          "
          } finally {
            Pop-Location
          }

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-x86_64
          path: dist/*.whl

  # ---------------------------------------------------------------------------
  # 3. Publication PyPI
  # ---------------------------------------------------------------------------
  publish-to-pypi:
    needs: [build-sdist, build-wheels]
    environment:
      name: release-python
      url: https://pypi.org/project/pymdurs
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download sdists and wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        if: inputs.dry-run == false
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  # ---------------------------------------------------------------------------
  # 4. Publication GitHub Release
  # ---------------------------------------------------------------------------
  publish-to-github:
    needs: [publish-to-pypi]
    if: inputs.dry-run == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Get version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m 1 -oP 'version = "\K[^"]+' pyproject.toml)
          if [[ "$VERSION" == *"-"* ]] || \
             [[ "$VERSION" == *"dev"* ]] || \
             [[ "$VERSION" == *"alpha"* ]] || \
             [[ "$VERSION" == *"beta"* ]] || \
             [[ "$VERSION" == *"rc"* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "version=$VERSION"             >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          name: Python pymdurs ${{ steps.version.outputs.version }}
          tag_name: py-${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          files: dist/*
          body: |
            ## Python Package Release ${{ steps.version.outputs.version }}

            ### Installation
            ```bash
            pip install pymdurs
            ```

            ### Available Classes

            - `pymdurs.geometric.Building` - Building data collection
            - `pymdurs.geometric.Dem` - Digital Elevation Model
            - `pymdurs.geometric.Cadastre` - Cadastral parcel data
            - `pymdurs.geometric.Iris` - IRIS statistical units
            - `pymdurs.geometric.Lcz` - Local Climate Zone
            - `pymdurs.BoundingBox` - Bounding box operations
            - `pymdurs.GeoCore` - CRS and geographic operations

            ### Changes

            See the [changelog](https://github.com/rupeelab17/pymdurs/blob/main/CHANGELOG.md) for details.

            ### Requirements

            - Python >= 3.8
            - pandas >= 2.0.0
            - numpy < 2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}