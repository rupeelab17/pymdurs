name: Release Python (Windows)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA
        type: string
      dry-run:
        description: Dry run
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.sha || github.sha }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  CARGO_HOME: C:\cargo
  CARGO_TARGET_DIR: C:\target

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # 1. Source distribution (Linux, inchangé)
  # ---------------------------------------------------------------------------
  build-sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install GDAL (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install maturin
        run: pip install maturin

      - name: Create source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >
            --manifest-path pymdurs/Cargo.toml
            --out dist
          maturin-version: 1.11.4

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ---------------------------------------------------------------------------
  # 2. Windows wheel
  # Stratégie :
  #   - GDAL 3.13.1 + GEOS + PROJ : conda-forge (gisinternals inaccessible depuis GitHub Actions)
  #   - Rust : toolchain MSVC + fork gdal fix/gdal-3.13-compat (GDT_UInt8, bindgen)
  #   - GDAL_VERSION doit être la version complète (ex. 3.13.1) pour les cfg gdal-sys
  # ---------------------------------------------------------------------------
  build-wheels:
    needs: [build-sdist]
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force `
            -ErrorAction SilentlyContinue | Out-Null
          New-Item -ItemType Directory -Force -Path $env:CARGO_HOME | Out-Null

      # ── Setup Python via conda ───────────────────────────────────────────────
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ env.PYTHON_VERSION }}
          channels: conda-forge
          channel-priority: strict
          activate-environment: true

      # ── GDAL + GEOS + PROJ via conda-forge ───────────────────────────────────
      # gisinternals.com est souvent inaccessible depuis les runners GitHub (timeout 443).
      - name: Install GDAL 3.13.1, GEOS, PROJ and bindgen deps via Conda
        shell: pwsh
        run: |
          # gdal=3.13.1 : aligné avec le fork gdal fix/gdal-3.13-compat (GDT_UInt8)
          # clang/libclang : bindgen requis pour GDAL > 3.12 (pas de prebuilt gdal-sys)
          conda install -c conda-forge `
            gdal=3.13.1 geos=3.14.1 proj sqlite pkg-config clang libclang --yes

          $prefix = (conda info --json | ConvertFrom-Json).active_prefix
          $lib    = "$prefix\Library"

          $gdalVer = ((conda list gdal) | Select-String "^gdal\s+").ToString().Trim() -split "\s+" | Select-Object -Index 1
          $geosVer = ((conda list geos) | Select-String "^geos\s+").ToString().Trim() -split "\s+" | Select-Object -Index 1
          $projVer = ((conda list proj) | Select-String "^proj\s+").ToString().Trim() -split "\s+" | Select-Object -Index 1
          Write-Host "GDAL $gdalVer  GEOS $geosVer  PROJ $projVer"
          if ($gdalVer -notmatch "^3\.13\.") {
            Write-Error "GDAL $gdalVer inattendu — attendu 3.13.x (crate gdal fix/gdal-3.13-compat)"
            exit 1
          }

          if (-not (Test-Path "$lib\include\gdal.h")) { Write-Error "gdal.h introuvable dans $lib\include" ; exit 1 }

          $gdalDll = Get-ChildItem "$lib\bin" -Filter "gdal*.dll" | Sort-Object Name | Select-Object -First 1
          $projDll = Get-ChildItem "$lib\bin" -Filter "proj*.dll" | Sort-Object Name | Select-Object -First 1
          $geosDll = Get-ChildItem "$lib\bin" -Filter "geos_c*.dll" | Sort-Object Name | Select-Object -First 1
          if (-not $gdalDll) { Write-Error "gdal*.dll introuvable" ; exit 1 }
          if (-not $projDll) { Write-Error "proj*.dll introuvable" ; exit 1 }
          if (-not $geosDll) { Write-Error "geos_c*.dll introuvable" ; exit 1 }

          # Forward slashes : évite l'interprétation de \t dans "true\Library" par GITHUB_ENV
          $pfx = $lib -replace '\\','/'

          if (-not (Test-Path "$lib\bin\libclang.dll")) {
            Write-Error "libclang.dll introuvable dans $lib\bin (bindgen)"
            Get-ChildItem "$lib\bin" -Filter "libclang*" | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

          "CONDA_LIB=$pfx"                  | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_HOME=$pfx"                  | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_LIB_DIR=$pfx/lib"           | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_INCLUDE_DIR=$pfx/include"   | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_VERSION=$gdalVer"           | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBCLANG_PATH=$pfx/bin"          | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CLANG_PATH=$pfx/bin/clang.exe"   | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_DLL_NAME=$($gdalDll.Name)"  | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_DLL_NAME=$($projDll.Name)"  | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GEOS_DLL_NAME=$($geosDll.Name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GEOS_VERSION=$geosVer"           | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_VERSION=$projVer"           | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GEOS_LIB_DIR=$pfx/lib"           | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_LIB=$pfx/share/proj"        | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_DATA=$pfx/share/proj"       | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_ROOT=$pfx"                  | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RUST_BACKTRACE=full"             | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "$lib\bin"                        | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "$prefix\bin"                     | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "GDAL OK — include=$lib\include  lib=$lib\lib  dll=$($gdalDll.FullName)"

      # ── Import libraries MSVC pour GDAL, PROJ et GEOS ─────────────────────────
      - name: Generate MSVC import libraries (gdal_i.lib + proj_i.lib + geos_c.lib)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -products * `
                       -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                       -property installationPath
          $vcVer  = Get-ChildItem "$vsPath\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1
          $binDir = "$($vcVer.FullName)\bin\Hostx64\x64"
          $dumpbin = "$binDir\dumpbin.exe"
          $libExe  = "$binDir\lib.exe"
          Write-Host "Outils MSVC : $binDir"

          function New-ImportLib($DllPath, $LibPath) {
            $dllName = Split-Path $DllPath -Leaf
            $defPath = "$env:TEMP\$([IO.Path]::GetFileNameWithoutExtension($dllName)).def"
            Write-Host "  $dllName -> $LibPath"
            $exports = & $dumpbin /exports $DllPath
            $symbols = $exports |
              Select-String -Pattern "^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)" |
              ForEach-Object { $_.Matches[0].Groups[1].Value }
            if ($symbols.Count -eq 0) { Write-Warning "Pas d'exports dans $dllName" ; return }
            "LIBRARY $dllName" | Out-File $defPath -Encoding ascii
            "EXPORTS"           | Out-File $defPath -Encoding ascii -Append
            $symbols            | Out-File $defPath -Encoding ascii -Append
            & $libExe /def:$defPath /out:$LibPath /machine:x64 | Out-Null
            Write-Host "  OK : $((Get-Item $LibPath).Length) bytes"
          }

          $libDir = "$env:CONDA_LIB/lib"
          if (Test-Path "$libDir/gdal_i.lib") {
            Write-Host "gdal_i.lib deja present"
          } elseif (Test-Path "$libDir/gdal.lib") {
            Copy-Item "$libDir/gdal.lib" "$libDir/gdal_i.lib" -Force
            Write-Host "gdal.lib copie vers gdal_i.lib"
          } else {
            New-ImportLib "$env:CONDA_LIB/bin/$env:GDAL_DLL_NAME" "$libDir/gdal_i.lib"
          }
          if (-not (Test-Path "$libDir/gdal_i.lib")) { Write-Error "gdal_i.lib introuvable" ; exit 1 }

          New-ImportLib "$env:CONDA_LIB/bin/$env:PROJ_DLL_NAME" "$libDir/proj_i.lib"
          Copy-Item "$libDir/proj_i.lib" "$libDir/proj.lib" -Force
          New-ImportLib "$env:CONDA_LIB/bin/$env:GEOS_DLL_NAME" "$libDir/geos_c.lib"

      # ── pkg-config .pc pour gdal-sys / proj-sys ──────────────────────────────
      # gdal.pc conda référence WS2_32.Lib (chemins absolus) → incompatible gdal-sys MSVC
      - name: Write pkg-config .pc files
        shell: pwsh
        run: |
          $pcDir = "$env:CONDA_LIB/lib/pkgconfig"
          New-Item -ItemType Directory -Force -Path $pcDir | Out-Null
          $pfx = $env:CONDA_LIB

          $gdalPc = @(
            "prefix=$pfx",
            'exec_prefix=${prefix}',
            'libdir=${prefix}/lib',
            'includedir=${prefix}/include',
            '',
            'Name: GDAL',
            'Description: Geospatial Data Abstraction Library',
            "Version: $env:GDAL_VERSION",
            'Libs: -L${libdir} -lgdal_i',
            'Cflags: -I${includedir}'
          )
          $gdalPc | Set-Content "$pcDir/gdal.pc" -Encoding ascii

          $projPc = @(
            "prefix=$pfx",
            'exec_prefix=${prefix}',
            'libdir=${prefix}/lib',
            'includedir=${prefix}/include',
            '',
            'Name: PROJ',
            'Description: Coordinate transformation library',
            "Version: $env:PROJ_VERSION",
            'Libs: -L${libdir} -lproj_i',
            'Cflags: -I${includedir}'
          )
          $projPc | Set-Content "$pcDir/proj.pc" -Encoding ascii
          "PKG_CONFIG_PATH=$pcDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "gdal.pc + proj.pc ecrits dans $pcDir"

      # ── LLVM système pour bindgen (libclang conda parfois illisible par bindgen) ─
      - name: Install LLVM for bindgen
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          $llvmBin = "C:/Program Files/LLVM/bin"
          if (-not (Test-Path "$llvmBin/libclang.dll")) {
            Write-Error "libclang.dll introuvable dans $llvmBin"
            exit 1
          }
          "LIBCLANG_PATH=$llvmBin"          | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CLANG_PATH=$llvmBin/clang.exe"   | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $llvmBin                          | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          clang --version

      # ── Rust MSVC ────────────────────────────────────────────────────────────
      - name: Install Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc
          rustup target add x86_64-pc-windows-msvc
          rustup default stable-x86_64-pc-windows-msvc
          rustup show

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            C:\cargo\registry
            C:\cargo\git
            C:\target
          key: cargo-${{ runner.os }}-msvc-conda-gdal-3.13-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-msvc-conda-gdal-3.13-

      - name: Install maturin
        shell: pwsh
        run: pip install maturin

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build wheel
        shell: pwsh
        env:
          GDAL_HOME: ${{ env.GDAL_HOME }}
          GDAL_LIB_DIR: ${{ env.GDAL_LIB_DIR }}
          GDAL_INCLUDE_DIR: ${{ env.GDAL_INCLUDE_DIR }}
          GDAL_VERSION: ${{ env.GDAL_VERSION }}
          LIBCLANG_PATH: ${{ env.LIBCLANG_PATH }}
          CLANG_PATH: ${{ env.CLANG_PATH }}
          GEOS_LIB_DIR: ${{ env.GEOS_LIB_DIR }}
          GEOS_VERSION: ${{ env.GEOS_VERSION }}
          PROJ_LIB: ${{ env.PROJ_LIB }}
          PROJ_DATA: ${{ env.PROJ_DATA }}
          PROJ_ROOT: ${{ env.PROJ_ROOT }}
          PKG_CONFIG_PATH: ${{ env.PKG_CONFIG_PATH }}
          RUST_BACKTRACE: full
        run: |
          maturin build `
            --release `
            --target x86_64-pc-windows-msvc `
            --manifest-path pymdurs/Cargo.toml `
            --out dist

      # ── Test ──────────────────────────────────────────────────────────────────
      - name: Test wheel
        shell: pwsh
        run: |
          pip install --force-reinstall --verbose (Get-Item dist\*.whl)
          Push-Location $env:TEMP
          try {
            python -c "import pymdurs; print('pymdurs imported successfully')"
            python -c "
          import pymdurs
          bbox = pymdurs.PyBoundingBox(-1.0, 46.0, 1.0, 47.0)
          print('PyBoundingBox works: min_x =', bbox.min_x)
          "
          } finally {
            Pop-Location
          }

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-x86_64
          path: dist/*.whl

  # ---------------------------------------------------------------------------
  # 3. Publication PyPI
  # ---------------------------------------------------------------------------
  publish-to-pypi:
    needs: [build-sdist, build-wheels]
    environment:
      name: release-python
      url: https://pypi.org/project/pymdurs
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download sdists and wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        if: inputs.dry-run == false
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  # ---------------------------------------------------------------------------
  # 4. Publication GitHub Release
  # ---------------------------------------------------------------------------
  publish-to-github:
    needs: [publish-to-pypi]
    if: inputs.dry-run == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Get version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m 1 -oP 'version = "\K[^"]+' pyproject.toml)
          if [[ "$VERSION" == *"-"* ]] || \
             [[ "$VERSION" == *"dev"* ]] || \
             [[ "$VERSION" == *"alpha"* ]] || \
             [[ "$VERSION" == *"beta"* ]] || \
             [[ "$VERSION" == *"rc"* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "version=$VERSION"             >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          name: Python pymdurs ${{ steps.version.outputs.version }}
          tag_name: py-${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          files: dist/*
          body: |
            ## Python Package Release ${{ steps.version.outputs.version }}

            ### Installation
            ```bash
            pip install pymdurs
            ```

            ### Available Classes

            - `pymdurs.geometric.Building` - Building data collection
            - `pymdurs.geometric.Dem` - Digital Elevation Model
            - `pymdurs.geometric.Cadastre` - Cadastral parcel data
            - `pymdurs.geometric.Iris` - IRIS statistical units
            - `pymdurs.geometric.Lcz` - Local Climate Zone
            - `pymdurs.BoundingBox` - Bounding box operations
            - `pymdurs.GeoCore` - CRS and geographic operations

            ### Changes

            See the [changelog](https://github.com/rupeelab17/pymdurs/blob/main/CHANGELOG.md) for details.

            ### Requirements

            - Python >= 3.8
            - pandas >= 2.0.0
            - numpy < 2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}