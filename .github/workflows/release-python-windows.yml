name: Release Python (Windows)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA
        type: string
      dry-run:
        description: Dry run
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.sha || github.sha }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  CARGO_HOME: C:\cargo
  CARGO_TARGET_DIR: C:\target

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # 1. Source distribution (Linux, inchangé)
  # ---------------------------------------------------------------------------
  build-sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install GDAL (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install maturin
        run: pip install maturin

      - name: Create source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >
            --manifest-path pymdurs/Cargo.toml
            --out dist
          maturin-version: 1.11.4

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ---------------------------------------------------------------------------
  # 2. Windows wheel
  # ---------------------------------------------------------------------------
  build-wheels:
    needs: [build-sdist]
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force `
            -ErrorAction SilentlyContinue | Out-Null
          New-Item -ItemType Directory -Force -Path $env:CARGO_HOME | Out-Null

      # ── Patch Cargo.toml : remplace le fork git par crates.io gdal 0.19 ───
      # Le fork fix/gdal-3.13-compat n'est pas nécessaire avec GDAL 3.12 (conda).
      # gdal 0.19 de crates.io supporte gdal-sys 0.11 qui gère MSVC correctement.
      - name: Patch Cargo.toml — use gdal crates.io instead of git fork
        shell: pwsh
        run: |
          $path = "pymdurs\Cargo.toml"
          $content = Get-Content $path -Raw

          # Remplace la ligne gdal = { git = ... } par la version crates.io
          $content = $content -replace `
            'gdal\s*=\s*\{[^}]*git\s*=\s*"https://github\.com/AlexanderWillner/gdal\.git"[^}]*\}', `
            'gdal = { version = "0.19", features = ["bindgen"], optional = true }'

          Set-Content $path $content -Encoding utf8
          Write-Host "Cargo.toml patché :"
          Select-String -Path $path -Pattern "^gdal"

      # ── Conda : Python + GDAL 3.12 + GEOS + PROJ ───────────────────────────
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ env.PYTHON_VERSION }}
          channels: conda-forge
          channel-priority: strict
          activate-environment: true

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: conda-${{ runner.os }}-gdal312-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: conda-${{ runner.os }}-gdal312-

      - name: Install GDAL 3.12, GEOS, PROJ via Conda
        shell: pwsh
        run: |
          # On épingle GDAL à 3.12.x — compatible avec gdal-crate 0.19 (crates.io)
          # GDAL 3.13 requiert le fork AlexanderWillner qui ne supporte pas MSVC proprement
          conda install -c conda-forge "libgdal=3.12" geos proj sqlite --yes

          $prefix = (conda info --json | ConvertFrom-Json).active_prefix
          $lib    = "$prefix\Library"

          Write-Host "Active conda prefix : $prefix"

          # Vérification DLL GDAL
          $dll = Get-ChildItem "$lib\bin" -Filter "gdal*.dll" -ErrorAction SilentlyContinue |
                 Sort-Object Name | Select-Object -First 1
          if ($dll) {
            Write-Host "✅ DLL trouvée : $($dll.FullName)"
          } else {
            Write-Error "❌ gdal*.dll introuvable dans $lib\bin"
            exit 1
          }

          # Version GDAL installée
          $gdalVer = (conda list libgdal) |
                     Select-String -Pattern "^libgdal\s+" |
                     ForEach-Object { ($_.ToString().Trim() -split "\s+")[1] }
          Write-Host "GDAL version installée : $gdalVer"

          # Version GEOS
          $geosLine = (conda list geos) | Select-String -Pattern "^geos\s+"
          if (-not $geosLine) { Write-Error "GEOS absent de l'env conda" ; exit 1 }
          $geosVer = ($geosLine.ToString().Trim() -split "\s+")[1]
          Write-Host "GEOS version : $geosVer"

          # Export variables
          "CONDA_LIB=$lib"                 | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_DLL_NAME=$($dll.Name)"     | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GEOS_VERSION=$geosVer"          | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_HOME=$lib"                 | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_LIB_DIR=$lib\lib"          | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_INCLUDE_DIR=$lib\include"  | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_VERSION=3"                 | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GEOS_LIB_DIR=$lib\lib"          | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_LIB=$lib\share\proj"       | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_DATA=$lib\share\proj"      | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RUST_BACKTRACE=1"               | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "$lib\bin"                       | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      # ── Génération de gdal_i.lib depuis la DLL conda ────────────────────────
      # conda-forge ne livre pas l'import library MSVC (.lib).
      # On la génère avec dumpbin + lib.exe (toujours présents sur windows-latest).
      - name: Generate gdal_i.lib (MSVC import library from conda DLL)
        shell: pwsh
        run: |
          # Localisation des outils MSVC via vswhere
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -products * `
                       -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                       -property installationPath
          if (-not $vsPath) { Write-Error "Visual Studio introuvable" ; exit 1 }

          $vcTools = Get-ChildItem "$vsPath\VC\Tools\MSVC" |
                     Sort-Object Name -Descending | Select-Object -First 1
          $binDir  = "$($vcTools.FullName)\bin\Hostx64\x64"
          $dumpbin = "$binDir\dumpbin.exe"
          $libExe  = "$binDir\lib.exe"

          Write-Host "Outils MSVC : $binDir"

          $dllPath = "$env:CONDA_LIB\bin\$env:GDAL_DLL_NAME"
          $defPath = "$env:TEMP\gdal.def"
          $libPath = "$env:CONDA_LIB\lib\gdal_i.lib"

          Write-Host "DLL source : $dllPath"

          # 1. Extraire les exports
          $exports = & $dumpbin /exports $dllPath
          if ($LASTEXITCODE -ne 0) { Write-Error "dumpbin échoué" ; exit 1 }

          # 2. Parser les exports et construire le .def
          # Format dumpbin : "   ordinal  hint  RVA       name"
          $lines = $exports | Select-String -Pattern "^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)" |
                              ForEach-Object { $_.Matches[0].Groups[1].Value }

          if ($lines.Count -eq 0) {
            Write-Error "Aucun export trouvé dans $dllPath — DLL invalide ?"
            exit 1
          }
          Write-Host "Exports trouvés : $($lines.Count) symboles"

          "LIBRARY $env:GDAL_DLL_NAME" | Out-File $defPath -Encoding ascii
          "EXPORTS"                     | Out-File $defPath -Encoding ascii -Append
          $lines                        | Out-File $defPath -Encoding ascii -Append

          # 3. Générer l'import library
          & $libExe /def:$defPath /out:$libPath /machine:x64
          if ($LASTEXITCODE -ne 0) { Write-Error "lib.exe échoué" ; exit 1 }

          if (Test-Path $libPath) {
            $size = (Get-Item $libPath).Length
            Write-Host "✅ gdal_i.lib généré : $libPath ($size bytes)"
          } else {
            Write-Error "❌ gdal_i.lib absent après génération"
            exit 1
          }

      # ── Rust MSVC ───────────────────────────────────────────────────────────
      - name: Install Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc
          rustup target add x86_64-pc-windows-msvc
          rustup default stable-x86_64-pc-windows-msvc
          rustup show

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            C:\cargo\registry
            C:\cargo\git
            C:\target
          key: cargo-${{ runner.os }}-msvc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-msvc-

      # ── maturin dans l'env conda ─────────────────────────────────────────────
      - name: Install maturin
        shell: pwsh
        run: pip install maturin

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build wheel (maturin direct)
        shell: pwsh
        env:
          GDAL_HOME: ${{ env.GDAL_HOME }}
          GDAL_LIB_DIR: ${{ env.GDAL_LIB_DIR }}
          GDAL_INCLUDE_DIR: ${{ env.GDAL_INCLUDE_DIR }}
          GDAL_VERSION: ${{ env.GDAL_VERSION }}
          GEOS_LIB_DIR: ${{ env.GEOS_LIB_DIR }}
          GEOS_VERSION: ${{ env.GEOS_VERSION }}
          PROJ_LIB: ${{ env.PROJ_LIB }}
          PROJ_DATA: ${{ env.PROJ_DATA }}
          RUST_BACKTRACE: 1
        run: |
          maturin build `
            --release `
            --target x86_64-pc-windows-msvc `
            --manifest-path pymdurs/Cargo.toml `
            --out dist

      # ── Test ─────────────────────────────────────────────────────────────────
      - name: Test wheel
        shell: pwsh
        run: |
          pip install --force-reinstall --verbose (Get-Item dist\*.whl)
          Push-Location $env:TEMP
          try {
            python -c "import pymdurs; print('✅ pymdurs imported successfully')"
            python -c "
          import pymdurs
          bbox = pymdurs.PyBoundingBox(-1.0, 46.0, 1.0, 47.0)
          print('✅ PyBoundingBox works: min_x =', bbox.min_x)
          "
          } finally {
            Pop-Location
          }

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-x86_64
          path: dist/*.whl

  # ---------------------------------------------------------------------------
  # 3. Publication PyPI
  # ---------------------------------------------------------------------------
  publish-to-pypi:
    needs: [build-sdist, build-wheels]
    environment:
      name: release-python
      url: https://pypi.org/project/pymdurs
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download sdists and wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        if: inputs.dry-run == false
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  # ---------------------------------------------------------------------------
  # 4. Publication GitHub Release
  # ---------------------------------------------------------------------------
  publish-to-github:
    needs: [publish-to-pypi]
    if: inputs.dry-run == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Get version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m 1 -oP 'version = "\K[^"]+' pyproject.toml)
          if [[ "$VERSION" == *"-"* ]] || \
             [[ "$VERSION" == *"dev"* ]] || \
             [[ "$VERSION" == *"alpha"* ]] || \
             [[ "$VERSION" == *"beta"* ]] || \
             [[ "$VERSION" == *"rc"* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "version=$VERSION"             >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          name: Python pymdurs ${{ steps.version.outputs.version }}
          tag_name: py-${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          files: dist/*
          body: |
            ## Python Package Release ${{ steps.version.outputs.version }}

            ### Installation
            ```bash
            pip install pymdurs
            ```

            ### Available Classes

            - `pymdurs.geometric.Building` - Building data collection
            - `pymdurs.geometric.Dem` - Digital Elevation Model
            - `pymdurs.geometric.Cadastre` - Cadastral parcel data
            - `pymdurs.geometric.Iris` - IRIS statistical units
            - `pymdurs.geometric.Lcz` - Local Climate Zone
            - `pymdurs.BoundingBox` - Bounding box operations
            - `pymdurs.GeoCore` - CRS and geographic operations

            ### Changes

            See the [changelog](https://github.com/rupeelab17/pymdurs/blob/main/CHANGELOG.md) for details.

            ### Requirements

            - Python >= 3.8
            - pandas >= 2.0.0
            - numpy < 2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}