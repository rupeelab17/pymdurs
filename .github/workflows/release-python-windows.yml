name: Release Python (Windows)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA
        type: string
      dry-run:
        description: Dry run
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.sha || github.sha }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  CARGO_HOME: C:\cargo
  CARGO_TARGET_DIR: C:\target

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # 1. Source distribution (Linux)
  # ---------------------------------------------------------------------------
  build-sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install GDAL (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install maturin
        run: pip install maturin

      - name: Create source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >
            --manifest-path pymdurs/Cargo.toml
            --out dist
          maturin-version: 1.11.4

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ---------------------------------------------------------------------------
  # 2. Windows wheel
  #
  # Stratégie finale (après nombreux essais) :
  #   - GDAL + GEOS + PROJ : conda-forge (builds MSVC natifs)
  #   - gdal_i.lib / proj_i.lib / geos_c.lib : générés via dumpbin+lib.exe
  #     (conda-forge ne livre pas les import libs MSVC)
  #   - gdal crate : 0.19 crates.io SANS feature "bindgen"
  #     (le fork AlexanderWillner génère 55 erreurs i32/u32 sur MSVC ;
  #      sans bindgen, gdal-sys utilise des bindings pré-générés en u32)
  #   - GDAL_NO_PKG_CONFIG=1 : évite que gdal-sys résolve via pkg-config
  #     et prenne les mauvaises libs
  #   - LIBCLANG_PATH : requis par proj-sys 0.27 et geos-sys (bindgen)
  # ---------------------------------------------------------------------------
  build-wheels:
    needs: [build-sdist]
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force `
            -ErrorAction SilentlyContinue | Out-Null
          New-Item -ItemType Directory -Force -Path $env:CARGO_HOME | Out-Null

      # ── Patch Cargo.toml : fork git → gdal 0.19 crates.io sans bindgen ─────
      # Le fork AlexanderWillner corrige GDAL 3.13 sur Linux/Mac mais produit
      # 55 erreurs de types i32/u32 sur Windows MSVC (bindgen génère i32 pour
      # les enums C, alors que le code Rust attend u32).
      # gdal 0.19 crates.io sans bindgen = bindings pré-générés stables (u32).
      - name: Patch Cargo.toml — replace git fork with gdal 0.19 (no bindgen)
        shell: pwsh
        run: |
          $cargo = Get-ChildItem -Recurse -Filter "Cargo.toml" |
                   Where-Object { (Get-Content $_.FullName -Raw) -match "AlexanderWillner" } |
                   Select-Object -First 1
          if (-not $cargo) {
            Write-Host "Aucun Cargo.toml avec AlexanderWillner — rien a patcher"
            Get-ChildItem -Recurse -Filter "Cargo.toml" | ForEach-Object { Write-Host $_.FullName }
            exit 0
          }
          Write-Host "Cargo.toml : $($cargo.FullName)"
          $content = Get-Content $cargo.FullName -Raw -Encoding utf8
          Write-Host "=== Avant ===" ; Select-String -Path $cargo.FullName -Pattern "^gdal\s*="
          $patched = [regex]::Replace(
            $content,
            '(?s)gdal\s*=\s*\{[^}]*AlexanderWillner[^}]*\}',
            'gdal = { version = "0.19", optional = true }'
          )
          if ($content -eq $patched) {
            Write-Error "Aucun remplacement effectue"
            exit 1
          }
          Set-Content $cargo.FullName $patched -Encoding utf8 -NoNewline
          Write-Host "=== Apres ===" ; Select-String -Path $cargo.FullName -Pattern "^gdal\s*="
          if ((Get-Content $cargo.FullName -Raw) -match "AlexanderWillner") {
            Write-Error "Patch echoue — AlexanderWillner encore present"
            exit 1
          }
          # Supprime Cargo.lock pour forcer la re-resolution sans le fork
          Get-ChildItem -Recurse -Filter "Cargo.lock" | Remove-Item -Force
          Write-Host "Patch OK + Cargo.lock supprime"

      # ── Conda : GDAL + GEOS + PROJ (builds MSVC natifs) ────────────────────
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ env.PYTHON_VERSION }}
          channels: conda-forge
          channel-priority: strict
          activate-environment: true

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: conda-${{ runner.os }}-geo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: conda-${{ runner.os }}-geo-

      - name: Install GDAL, GEOS, PROJ via Conda
        shell: pwsh
        run: |
          conda install -c conda-forge libgdal geos proj sqlite pkg-config --yes

          $prefix = (conda info --json | ConvertFrom-Json).active_prefix
          $lib    = "$prefix\Library"
          Write-Host "Conda prefix : $prefix"
          Write-Host "Library      : $lib"

          # Locate DLLs
          $gdalDll = Get-ChildItem "$lib\bin" -Filter "gdal*.dll" | Sort-Object Name | Select-Object -First 1
          $projDll = Get-ChildItem "$lib\bin" -Filter "proj*.dll" | Sort-Object Name | Select-Object -First 1
          $geosDll = Get-ChildItem "$lib\bin" -Filter "geos_c*.dll" | Sort-Object Name | Select-Object -First 1
          if (-not $gdalDll) { Write-Error "gdal*.dll introuvable" ; exit 1 }
          if (-not $projDll) { Write-Error "proj*.dll introuvable" ; exit 1 }
          if (-not $geosDll) { Write-Error "geos_c*.dll introuvable" ; exit 1 }
          Write-Host "GDAL DLL : $($gdalDll.Name)"
          Write-Host "PROJ DLL : $($projDll.Name)"
          Write-Host "GEOS DLL : $($geosDll.Name)"

          # Versions
          $geosVer = ((conda list geos)  | Select-String "^geos\s+").ToString().Trim()  -split "\s+" | Select-Object -Index 1
          $projVer = ((conda list proj)  | Select-String "^proj\s+").ToString().Trim()  -split "\s+" | Select-Object -Index 1
          $gdalVer = ((conda list libgdal)| Select-String "^libgdal\s+").ToString().Trim() -split "\s+" | Select-Object -Index 1
          Write-Host "GDAL $gdalVer  GEOS $geosVer  PROJ $projVer"

          # Export
          "CONDA_LIB=$lib"                 | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CONDA_PREFIX=$prefix"           | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_DLL_NAME=$($gdalDll.Name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_DLL_NAME=$($projDll.Name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GEOS_DLL_NAME=$($geosDll.Name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_VERSION_FULL=$gdalVer"     | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GEOS_VERSION=$geosVer"          | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_VERSION=$projVer"          | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_HOME=$lib"                 | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_LIB_DIR=$lib\lib"          | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_INCLUDE_DIR=$lib\include"  | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_NO_PKG_CONFIG=1"           | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GEOS_LIB_DIR=$lib\lib"          | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_LIB=$lib\share\proj"       | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_DATA=$lib\share\proj"      | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_ROOT=$lib"                 | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RUST_BACKTRACE=full"            | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "$lib\bin"                       | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "$prefix\bin"                    | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      # ── Génération des import libs MSVC ─────────────────────────────────────
      # conda-forge ne livre pas les .lib MSVC — on les génère depuis les DLLs
      # avec dumpbin (export table) + lib.exe (toujours présents sur windows-latest)
      - name: Generate MSVC import libraries (gdal_i.lib + proj_i.lib + geos_c.lib)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -products * `
                       -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                       -property installationPath
          $vcVer  = Get-ChildItem "$vsPath\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1
          $msvcBin = "$($vcVer.FullName)\bin\Hostx64\x64"
          Write-Host "MSVC tools : $msvcBin"

          function New-ImportLib($DllPath, $LibPath) {
            $dllName = Split-Path $DllPath -Leaf
            $defPath = "$env:TEMP\$([IO.Path]::GetFileNameWithoutExtension($dllName)).def"
            Write-Host "  $dllName -> $(Split-Path $LibPath -Leaf)"
            $exports = & "$msvcBin\dumpbin.exe" /exports $DllPath
            $symbols = $exports |
              Select-String -Pattern "^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)" |
              ForEach-Object { $_.Matches[0].Groups[1].Value }
            if ($symbols.Count -eq 0) { Write-Warning "Aucun export dans $dllName" ; return }
            "LIBRARY $dllName" | Out-File $defPath -Encoding ascii
            "EXPORTS"           | Out-File $defPath -Encoding ascii -Append
            $symbols            | Out-File $defPath -Encoding ascii -Append
            & "$msvcBin\lib.exe" /def:$defPath /out:$LibPath /machine:x64 | Out-Null
            if (Test-Path $LibPath) { Write-Host "    OK ($((Get-Item $LibPath).Length) bytes)" }
            else { Write-Error "Echec generation $LibPath" ; exit 1 }
          }

          $libDir  = "$env:CONDA_LIB\lib"
          $binDir  = "$env:CONDA_LIB\bin"

          New-ImportLib "$binDir\$env:GDAL_DLL_NAME" "$libDir\gdal_i.lib"
          New-ImportLib "$binDir\$env:PROJ_DLL_NAME" "$libDir\proj_i.lib"
          Copy-Item "$libDir\proj_i.lib" "$libDir\proj.lib" -Force
          New-ImportLib "$binDir\$env:GEOS_DLL_NAME" "$libDir\geos_c.lib"

          Write-Host "Import libs generees :"
          @("gdal_i.lib","proj_i.lib","proj.lib","geos_c.lib") | ForEach-Object {
            $p = "$libDir\$_"
            if (Test-Path $p) { Write-Host "  $_ OK" } else { Write-Warning "  $_ ABSENT" }
          }

      # ── pkg-config .pc pour proj-sys ─────────────────────────────────────────
      - name: Write pkg-config .pc files
        shell: pwsh
        run: |
          $pcDir = "$env:CONDA_LIB\lib\pkgconfig"
          New-Item -ItemType Directory -Force -Path $pcDir | Out-Null
          $pfx = $env:CONDA_LIB -replace "\\","/"
          $projPc = @(
            "prefix=$pfx", "exec_prefix=`${prefix}",
            "libdir=`${prefix}/lib", "includedir=`${prefix}/include", "",
            "Name: PROJ", "Description: Coordinate transformation library",
            "Version: $env:PROJ_VERSION",
            "Libs: -L`${libdir} -lproj_i", "Cflags: -I`${includedir}"
          )
          $projPc | Set-Content "$pcDir\proj.pc" -Encoding ascii
          "PKG_CONFIG_PATH=$pcDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "proj.pc ecrit dans $pcDir"

      # ── LIBCLANG_PATH pour proj-sys / geos-sys (bindgen) ────────────────────
      # proj-sys 0.27 et geos-sys utilisent bindgen → besoin de libclang.dll
      # LLVM est pré-installé sur windows-latest mais LIBCLANG_PATH non défini
      - name: Set LIBCLANG_PATH
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files\LLVM\bin",
            "C:\LLVM\bin"
          )
          $found = $null
          foreach ($c in $candidates) {
            if (Test-Path "$c\libclang.dll") { $found = $c ; break }
          }
          if (-not $found) {
            $dll = Get-ChildItem "C:\Program Files" -Recurse -Filter "libclang.dll" `
                   -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($dll) { $found = Split-Path $dll.FullName }
          }
          if (-not $found) {
            Write-Host "libclang.dll introuvable — installation LLVM via choco..."
            choco install llvm --version=18.1.8 -y --no-progress
            $found = "C:\Program Files\LLVM\bin"
          }
          Write-Host "LIBCLANG_PATH = $found"
          "LIBCLANG_PATH=$found" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      # ── Rust MSVC ────────────────────────────────────────────────────────────
      - name: Install Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc
          rustup target add x86_64-pc-windows-msvc
          rustup default stable-x86_64-pc-windows-msvc
          rustup show

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            C:\cargo\registry
            C:\cargo\git
            C:\target
          key: cargo-${{ runner.os }}-msvc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-msvc-

      - name: Install maturin
        shell: pwsh
        run: pip install maturin

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build wheel
        shell: pwsh
        env:
          GDAL_HOME: ${{ env.GDAL_HOME }}
          GDAL_LIB_DIR: ${{ env.GDAL_LIB_DIR }}
          GDAL_INCLUDE_DIR: ${{ env.GDAL_INCLUDE_DIR }}
          GDAL_NO_PKG_CONFIG: "1"
          GEOS_LIB_DIR: ${{ env.GEOS_LIB_DIR }}
          GEOS_VERSION: ${{ env.GEOS_VERSION }}
          PROJ_LIB: ${{ env.PROJ_LIB }}
          PROJ_DATA: ${{ env.PROJ_DATA }}
          PROJ_ROOT: ${{ env.PROJ_ROOT }}
          PKG_CONFIG_PATH: ${{ env.PKG_CONFIG_PATH }}
          LIBCLANG_PATH: ${{ env.LIBCLANG_PATH }}
          RUST_BACKTRACE: full
        run: |
          maturin build `
            --release `
            --target x86_64-pc-windows-msvc `
            --manifest-path pymdurs/Cargo.toml `
            --out dist

      # ── Test ──────────────────────────────────────────────────────────────────
      - name: Test wheel
        shell: pwsh
        run: |
          pip install --force-reinstall --verbose (Get-Item dist\*.whl)
          Push-Location $env:TEMP
          try {
            python -c "import pymdurs; print('pymdurs imported successfully')"
            python -c "
          import pymdurs
          bbox = pymdurs.PyBoundingBox(-1.0, 46.0, 1.0, 47.0)
          print('PyBoundingBox works: min_x =', bbox.min_x)
          "
          } finally {
            Pop-Location
          }

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-x86_64
          path: dist/*.whl

  # ---------------------------------------------------------------------------
  # 3. Publication PyPI
  # ---------------------------------------------------------------------------
  publish-to-pypi:
    needs: [build-sdist, build-wheels]
    environment:
      name: release-python
      url: https://pypi.org/project/pymdurs
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download sdists and wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        if: inputs.dry-run == false
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  # ---------------------------------------------------------------------------
  # 4. Publication GitHub Release
  # ---------------------------------------------------------------------------
  publish-to-github:
    needs: [publish-to-pypi]
    if: inputs.dry-run == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Get version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m 1 -oP 'version = "\K[^"]+' pyproject.toml)
          if [[ "$VERSION" == *"-"* ]] || \
             [[ "$VERSION" == *"dev"* ]] || \
             [[ "$VERSION" == *"alpha"* ]] || \
             [[ "$VERSION" == *"beta"* ]] || \
             [[ "$VERSION" == *"rc"* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "version=$VERSION"             >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          name: Python pymdurs ${{ steps.version.outputs.version }}
          tag_name: py-${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          files: dist/*
          body: |
            ## Python Package Release ${{ steps.version.outputs.version }}

            ### Installation
            ```bash
            pip install pymdurs
            ```

            ### Available Classes

            - `pymdurs.geometric.Building` - Building data collection
            - `pymdurs.geometric.Dem` - Digital Elevation Model
            - `pymdurs.geometric.Cadastre` - Cadastral parcel data
            - `pymdurs.geometric.Iris` - IRIS statistical units
            - `pymdurs.geometric.Lcz` - Local Climate Zone
            - `pymdurs.BoundingBox` - Bounding box operations
            - `pymdurs.GeoCore` - CRS and geographic operations

            ### Changes

            See the [changelog](https://github.com/rupeelab17/pymdurs/blob/main/CHANGELOG.md) for details.

            ### Requirements

            - Python >= 3.8
            - pandas >= 2.0.0
            - numpy < 2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}