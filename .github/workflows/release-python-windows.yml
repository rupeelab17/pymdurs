name: Release Python (Windows)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA
        type: string
      dry-run:
        description: Dry run
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.sha || github.sha }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  CARGO_HOME: C:\cargo
  CARGO_TARGET_DIR: C:\target

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # 1. Source distribution (Linux, inchangé)
  # ---------------------------------------------------------------------------
  build-sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install GDAL (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install maturin
        run: pip install maturin

      - name: Create source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >
            --manifest-path pymdurs/Cargo.toml
            --out dist
          maturin-version: 1.11.4

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ---------------------------------------------------------------------------
  # 2. Windows wheel
  # Stratégie :
  #   - GDAL : binaires officiels MSVC gisinternals.com (gdal_i.lib + headers + DLLs)
  #   - GEOS + PROJ : conda-forge (+ génération manuelle des .lib MSVC)
  #   - Rust : toolchain MSVC
  #   - gdal crate : 0.19 crates.io (fork AlexanderWillner non testé sur Windows MSVC)
  # ---------------------------------------------------------------------------
  build-wheels:
    needs: [build-sdist]
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force `
            -ErrorAction SilentlyContinue | Out-Null
          New-Item -ItemType Directory -Force -Path $env:CARGO_HOME | Out-Null

      # ── Patch Cargo.toml : fork git → crates.io gdal 0.19 ──────────────────
      # Le fork AlexanderWillner corrige GDAL 3.13 sur Linux/Mac mais produit
      # 55+ erreurs de types i32/u32 sur Windows MSVC (bindgen génère des types
      # différents selon la plateforme). gdal 0.19 crates.io + gisinternals = OK.
      - name: Patch Cargo.toml — replace git fork with gdal 0.19 crates.io
        shell: bash
        run: |
          CARGO=$(find . -name "Cargo.toml" | xargs grep -l "AlexanderWillner" 2>/dev/null | head -1)
          if [ -z "$CARGO" ]; then
            echo "Aucun Cargo.toml avec AlexanderWillner — rien a patcher"
            exit 0
          fi
          echo "Patching: $CARGO"
          sed -i 's|gdal = { git = "https://github.com/AlexanderWillner/gdal.git"[^}]*}|gdal = { version = "0.19", features = ["bindgen"], optional = true }|' "$CARGO"
          grep -n "gdal" "$CARGO"
          if grep -q "AlexanderWillner" "$CARGO"; then
            echo "ERREUR: patch echoue"
            exit 1
          fi
          echo "Patch OK"

      # ── Setup Python via conda ───────────────────────────────────────────────
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ env.PYTHON_VERSION }}
          channels: conda-forge
          channel-priority: strict
          activate-environment: true

      # ── GDAL officiel Windows (gisinternals) ────────────────────────────────
      # gisinternals.com = builds MSVC officiels de Tamas Szekeres (mainteneur GDAL Windows)
      # Fournit gdal_i.lib + gdal.h + gdal*.dll — tout ce dont gdal-sys a besoin sur MSVC
      # gdal 0.19 crates.io est compatible avec GDAL 3.12 gisinternals
      - name: Download and install GDAL from gisinternals
        shell: pwsh
        run: |
          # gisinternals publie 2 zips distincts pour chaque version :
          #   release-XXXX-x64-gdal-X-X-X-mapserver-X-X-X.zip      → DLLs (bin\)
          #   release-XXXX-x64-gdal-X-X-X-mapserver-X-X-X-libs.zip → headers + .lib
          # Il faut les deux.
          $base    = "release-1929-x64-gdal-3-12-1-mapserver-8-6-0"
          $urlRoot = "https://download.gisinternals.com/sdk/downloads"
          $tmp     = "$env:TEMP\gdal_sdk"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $gdal = "C:\gdal"
          New-Item -ItemType Directory -Force -Path $gdal | Out-Null

          # 1. Package runtime (DLLs)
          $runtimeUrl = "$urlRoot\$base.zip"
          Write-Host "Telechargement runtime : $runtimeUrl"
          Invoke-WebRequest $runtimeUrl -OutFile "$tmp\runtime.zip" -TimeoutSec 180
          Expand-Archive "$tmp\runtime.zip" -DestinationPath "$gdal" -Force

          # 2. Package developpement (headers + gdal_i.lib)
          $libsUrl = "$urlRoot\$base-libs.zip"
          Write-Host "Telechargement libs : $libsUrl"
          Invoke-WebRequest $libsUrl -OutFile "$tmp\libs.zip" -TimeoutSec 180
          Expand-Archive "$tmp\libs.zip" -DestinationPath "$gdal" -Force

          Write-Host "Contenu C:\gdal :"
          Get-ChildItem $gdal | ForEach-Object { Write-Host "  $($_.Name)" }

          # Localisation dynamique (la structure exacte peut varier)
          $libFile = Get-ChildItem $gdal -Recurse -Filter "gdal_i.lib" | Select-Object -First 1
          if (-not $libFile) {
            Write-Error "gdal_i.lib introuvable — .lib presents :"
            Get-ChildItem $gdal -Recurse -Filter "*.lib" | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }
          $libDir = Split-Path $libFile.FullName
          Write-Host "gdal_i.lib : $($libFile.FullName)"

          $hdrFile = Get-ChildItem $gdal -Recurse -Filter "gdal.h" | Select-Object -First 1
          if (-not $hdrFile) { Write-Error "gdal.h introuvable" ; exit 1 }
          $incDir = Split-Path $hdrFile.FullName
          Write-Host "gdal.h     : $($hdrFile.FullName)"

          $dllFile = Get-ChildItem $gdal -Recurse -Filter "gdal*.dll" | Select-Object -First 1
          if (-not $dllFile) { Write-Error "gdal*.dll introuvable" ; exit 1 }
          $dllDir = Split-Path $dllFile.FullName
          Write-Host "gdal DLL   : $($dllFile.FullName)"

          "GDAL_HOME=$gdal"          | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_LIB_DIR=$libDir"     | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_INCLUDE_DIR=$incDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_VERSION=3"           | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "$dllDir"                  | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "GDAL OK — lib=$libDir  include=$incDir  dll=$dllDir"

      # ── GEOS + PROJ via conda ────────────────────────────────────────────────
      - name: Install GEOS and PROJ via Conda
        shell: pwsh
        run: |
          conda install -c conda-forge geos proj sqlite pkg-config --yes

          $prefix = (conda info --json | ConvertFrom-Json).active_prefix
          $lib    = "$prefix\Library"

          $geosVer = ((conda list geos) | Select-String "^geos\s+").ToString().Trim() -split "\s+" | Select-Object -Index 1
          $projVer = ((conda list proj) | Select-String "^proj\s+").ToString().Trim() -split "\s+" | Select-Object -Index 1
          Write-Host "GEOS $geosVer  PROJ $projVer"

          $projDll = Get-ChildItem "$lib\bin" -Filter "proj*.dll" | Sort-Object Name | Select-Object -First 1
          $geosDll = Get-ChildItem "$lib\bin" -Filter "geos_c*.dll" | Sort-Object Name | Select-Object -First 1
          if (-not $projDll) { Write-Error "proj*.dll introuvable" ; exit 1 }
          if (-not $geosDll) { Write-Error "geos_c*.dll introuvable" ; exit 1 }

          "CONDA_LIB=$lib"                 | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_DLL_NAME=$($projDll.Name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GEOS_DLL_NAME=$($geosDll.Name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GEOS_VERSION=$geosVer"          | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_VERSION=$projVer"          | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GEOS_LIB_DIR=$lib\lib"          | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_LIB=$lib\share\proj"       | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_DATA=$lib\share\proj"      | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJ_ROOT=$lib"                 | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RUST_BACKTRACE=full"            | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "$lib\bin"                       | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "$prefix\bin"                    | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      # ── Import libraries MSVC pour PROJ et GEOS ──────────────────────────────
      - name: Generate MSVC import libraries (proj_i.lib + geos_c.lib)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -products * `
                       -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                       -property installationPath
          $vcVer  = Get-ChildItem "$vsPath\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1
          $binDir = "$($vcVer.FullName)\bin\Hostx64\x64"
          $dumpbin = "$binDir\dumpbin.exe"
          $libExe  = "$binDir\lib.exe"
          Write-Host "Outils MSVC : $binDir"

          function New-ImportLib($DllPath, $LibPath) {
            $dllName = Split-Path $DllPath -Leaf
            $defPath = "$env:TEMP\$([IO.Path]::GetFileNameWithoutExtension($dllName)).def"
            Write-Host "  $dllName -> $LibPath"
            $exports = & $dumpbin /exports $DllPath
            $symbols = $exports |
              Select-String -Pattern "^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)" |
              ForEach-Object { $_.Matches[0].Groups[1].Value }
            if ($symbols.Count -eq 0) { Write-Warning "Pas d'exports dans $dllName" ; return }
            "LIBRARY $dllName" | Out-File $defPath -Encoding ascii
            "EXPORTS"           | Out-File $defPath -Encoding ascii -Append
            $symbols            | Out-File $defPath -Encoding ascii -Append
            & $libExe /def:$defPath /out:$LibPath /machine:x64 | Out-Null
            Write-Host "  OK : $((Get-Item $LibPath).Length) bytes"
          }

          $libDir = "$env:CONDA_LIB\lib"
          New-ImportLib "$env:CONDA_LIB\bin\$env:PROJ_DLL_NAME" "$libDir\proj_i.lib"
          Copy-Item "$libDir\proj_i.lib" "$libDir\proj.lib" -Force
          New-ImportLib "$env:CONDA_LIB\bin\$env:GEOS_DLL_NAME" "$libDir\geos_c.lib"

      # ── pkg-config .pc pour proj-sys ─────────────────────────────────────────
      - name: Write pkg-config .pc files
        shell: pwsh
        run: |
          $pcDir = "$env:CONDA_LIB\lib\pkgconfig"
          New-Item -ItemType Directory -Force -Path $pcDir | Out-Null
          $pfx = $env:CONDA_LIB -replace "\\","/"

          $projPc = @(
            "prefix=$pfx",
            'exec_prefix=${prefix}',
            'libdir=${prefix}/lib',
            'includedir=${prefix}/include',
            '',
            'Name: PROJ',
            'Description: Coordinate transformation library',
            "Version: $env:PROJ_VERSION",
            'Libs: -L${libdir} -lproj_i',
            'Cflags: -I${includedir}'
          )
          $projPc | Set-Content "$pcDir\proj.pc" -Encoding ascii
          "PKG_CONFIG_PATH=$pcDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "proj.pc ecrit dans $pcDir"

      # ── Rust MSVC ────────────────────────────────────────────────────────────
      - name: Install Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc
          rustup target add x86_64-pc-windows-msvc
          rustup default stable-x86_64-pc-windows-msvc
          rustup show

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            C:\cargo\registry
            C:\cargo\git
            C:\target
          key: cargo-${{ runner.os }}-msvc-gisinternals-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-msvc-gisinternals-

      - name: Install maturin
        shell: pwsh
        run: pip install maturin

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build wheel
        shell: pwsh
        env:
          GDAL_HOME: ${{ env.GDAL_HOME }}
          GDAL_LIB_DIR: ${{ env.GDAL_LIB_DIR }}
          GDAL_INCLUDE_DIR: ${{ env.GDAL_INCLUDE_DIR }}
          GDAL_VERSION: ${{ env.GDAL_VERSION }}
          GEOS_LIB_DIR: ${{ env.GEOS_LIB_DIR }}
          GEOS_VERSION: ${{ env.GEOS_VERSION }}
          PROJ_LIB: ${{ env.PROJ_LIB }}
          PROJ_DATA: ${{ env.PROJ_DATA }}
          PROJ_ROOT: ${{ env.PROJ_ROOT }}
          PKG_CONFIG_PATH: ${{ env.PKG_CONFIG_PATH }}
          RUST_BACKTRACE: full
        run: |
          maturin build `
            --release `
            --target x86_64-pc-windows-msvc `
            --manifest-path pymdurs/Cargo.toml `
            --out dist

      # ── Test ──────────────────────────────────────────────────────────────────
      - name: Test wheel
        shell: pwsh
        run: |
          pip install --force-reinstall --verbose (Get-Item dist\*.whl)
          Push-Location $env:TEMP
          try {
            python -c "import pymdurs; print('pymdurs imported successfully')"
            python -c "
          import pymdurs
          bbox = pymdurs.PyBoundingBox(-1.0, 46.0, 1.0, 47.0)
          print('PyBoundingBox works: min_x =', bbox.min_x)
          "
          } finally {
            Pop-Location
          }

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-x86_64
          path: dist/*.whl

  # ---------------------------------------------------------------------------
  # 3. Publication PyPI
  # ---------------------------------------------------------------------------
  publish-to-pypi:
    needs: [build-sdist, build-wheels]
    environment:
      name: release-python
      url: https://pypi.org/project/pymdurs
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download sdists and wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        if: inputs.dry-run == false
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  # ---------------------------------------------------------------------------
  # 4. Publication GitHub Release
  # ---------------------------------------------------------------------------
  publish-to-github:
    needs: [publish-to-pypi]
    if: inputs.dry-run == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Get version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m 1 -oP 'version = "\K[^"]+' pyproject.toml)
          if [[ "$VERSION" == *"-"* ]] || \
             [[ "$VERSION" == *"dev"* ]] || \
             [[ "$VERSION" == *"alpha"* ]] || \
             [[ "$VERSION" == *"beta"* ]] || \
             [[ "$VERSION" == *"rc"* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "version=$VERSION"             >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          name: Python pymdurs ${{ steps.version.outputs.version }}
          tag_name: py-${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          files: dist/*
          body: |
            ## Python Package Release ${{ steps.version.outputs.version }}

            ### Installation
            ```bash
            pip install pymdurs
            ```

            ### Available Classes

            - `pymdurs.geometric.Building` - Building data collection
            - `pymdurs.geometric.Dem` - Digital Elevation Model
            - `pymdurs.geometric.Cadastre` - Cadastral parcel data
            - `pymdurs.geometric.Iris` - IRIS statistical units
            - `pymdurs.geometric.Lcz` - Local Climate Zone
            - `pymdurs.BoundingBox` - Bounding box operations
            - `pymdurs.GeoCore` - CRS and geographic operations

            ### Changes

            See the [changelog](https://github.com/rupeelab17/pymdurs/blob/main/CHANGELOG.md) for details.

            ### Requirements

            - Python >= 3.8
            - pandas >= 2.0.0
            - numpy < 2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}