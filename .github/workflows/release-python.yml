name: Release Python

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA
        type: string
      dry-run:
        description: Dry run
        type: boolean
        default: false
      windows-run-id:
        description: >-
          Run ID de "Release Python (Windows)" lancé en dry-run sur le même SHA
          (obligatoire hors dry-run)
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.sha || github.sha }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install GDAL (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install maturin
        run: pip install maturin

      - name: Create source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >
            --manifest-path pymdurs/Cargo.toml
            --out dist
          maturin-version: 1.11.4

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    needs: [build-sdist]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x86-64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            architecture: aarch64
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            architecture: aarch64
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Set swap space for Linux
        if: runner.os == 'Linux'
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install GDAL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin libclang-dev

      - name: Install GDAL (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install gdal

      # lddtree only searches ~/lib, /usr/local/lib, /lib, /usr/lib — not Homebrew.
      # SIP also strips DYLD_* from child processes, so symlink into ~/lib instead.
      - name: Homebrew libs for delocate
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$HOME/lib"
          shopt -s nullglob
          for f in "$(brew --prefix)/lib"/lib*.dylib; do
            ln -sf "$f" "$HOME/lib/"
          done

      - name: Install maturin
        run: pip install maturin

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          container: off
          args: >
            --release
            --manifest-path pymdurs/Cargo.toml
            --out dist
            --auditwheel repair
          maturin-version: 1.11.4

      - name: Test wheel
        run: |
          pip install --force-reinstall --verbose dist/*.whl
          cd /tmp
          python -c 'import pymdurs; print("pymdurs imported successfully")'
          python -c 'import pymdurs; print("Available classes:", [x for x in dir(pymdurs.geometric) if not x.startswith("_")])'
          python -c 'import pymdurs; bbox = pymdurs.PyBoundingBox(-1.0, 46.0, 1.0, 47.0); print("PyBoundingBox works:", bbox.min_x)'

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.architecture }}
          path: dist/*.whl

  # ---------------------------------------------------------------------------
  # Wheel Windows : construit par release-python-windows.yml (lancé en
  # dry-run, donc sans publication), récupéré ici pour que les 5 fichiers de
  # la release soient publiés par ce seul workflow (provenance cohérente).
  # ---------------------------------------------------------------------------
  fetch-windows-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check inputs
        env:
          RUN_ID: ${{ inputs.windows-run-id }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ -z "$RUN_ID" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::notice::Pas de windows-run-id : dry-run sans wheel Windows."
            else
              echo "::error::windows-run-id est obligatoire hors dry-run."
              exit 1
            fi
          fi

      - name: Checkout
        if: inputs.windows-run-id != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Verify Windows run
        if: inputs.windows-run-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.windows-run-id }}
          EXPECTED_SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
          path=$(jq -r '.path' <<<"$run_json")
          event=$(jq -r '.event' <<<"$run_json")
          status=$(jq -r '.status' <<<"$run_json")
          conclusion=$(jq -r '.conclusion' <<<"$run_json")
          head_sha=$(jq -r '.head_sha' <<<"$run_json")
          echo "Run $RUN_ID : path=$path event=$event status=$status conclusion=$conclusion head_sha=$head_sha"
          case "$path" in
            .github/workflows/release-python-windows.yml*) ;;
            *) echo "::error::Le run $RUN_ID ne vient pas de release-python-windows.yml ($path)"; exit 1 ;;
          esac
          [ "$event" = "workflow_dispatch" ] || { echo "::error::Run non lancé par workflow_dispatch ($event)"; exit 1; }
          [ "$status" = "completed" ] && [ "$conclusion" = "success" ] \
            || { echo "::error::Run Windows non terminé avec succès ($status/$conclusion)"; exit 1; }
          # head_sha = tête de branche au moment du dispatch, pas forcément l'input sha.
          if [ "$head_sha" != "$EXPECTED_SHA" ]; then
            echo "::warning::head_sha du run Windows ($head_sha) différent de $EXPECTED_SHA — vérifier que le même sha a été passé en input."
          fi

      - name: Download Windows wheel
        if: inputs.windows-run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: wheel-windows-x86_64
          path: dist
          run-id: ${{ inputs.windows-run-id }}
          github-token: ${{ github.token }}

      - name: Check wheel version
        if: inputs.windows-run-id != ''
        run: |
          set -euo pipefail
          VERSION=$(grep -m 1 -oP 'version = "\K[^"]+' pyproject.toml)
          shopt -s nullglob
          wheels=(dist/*.whl)
          [ "${#wheels[@]}" -eq 1 ] || { echo "::error::Attendu 1 wheel, trouvé ${#wheels[@]}"; ls -l dist; exit 1; }
          expected="dist/pymdurs-${VERSION}-cp312-abi3-win_amd64.whl"
          [ "${wheels[0]}" = "$expected" ] \
            || { echo "::error::Wheel ${wheels[0]} ≠ attendu $expected"; exit 1; }
          sha256sum "${wheels[0]}"

      - name: Upload Windows wheel
        if: inputs.windows-run-id != ''
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-x86_64
          path: dist/*.whl

  publish-to-pypi:
    needs: [build-sdist, build-wheels, fetch-windows-wheel]
    environment:
      name: release-python
      url: https://pypi.org/project/pymdurs
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download sdists and wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check release contents
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          ls -l dist
          n_sdist=$(ls dist/*.tar.gz 2>/dev/null | wc -l)
          n_whl=$(ls dist/*.whl 2>/dev/null | wc -l)
          n_win=$(ls dist/*win_amd64.whl 2>/dev/null | wc -l)
          echo "sdist=$n_sdist wheels=$n_whl (dont windows=$n_win)"
          if [ "$DRY_RUN" != "true" ]; then
            [ "$n_sdist" -eq 1 ] && [ "$n_whl" -eq 4 ] && [ "$n_win" -eq 1 ] \
              || { echo "::error::Release incomplète : attendu 1 sdist + 4 wheels dont 1 Windows"; exit 1; }
          fi

      - name: Publish to PyPI
        if: inputs.dry-run == false
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  publish-to-github:
    needs: [publish-to-pypi]
    if: inputs.dry-run == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Get version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m 1 -oP 'version = "\K[^"]+' pyproject.toml)
          if [[ "$VERSION" == *"-"* ]] || [[ "$VERSION" == *"dev"* ]] || [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"rc"* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Python pymdurs ${{ steps.version.outputs.version }}
          tag_name: py-${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          files: dist/*
          body: |
            ## Python Package Release ${{ steps.version.outputs.version }}

            This release includes Python bindings for pymdurs.

            ### Installation

            ```bash
            pip install pymdurs
            ```

            ### Available Classes

            - `pymdurs.geometric.Building` - Building data collection
            - `pymdurs.geometric.Dem` - Digital Elevation Model
            - `pymdurs.geometric.Cadastre` - Cadastral parcel data
            - `pymdurs.geometric.Iris` - IRIS statistical units
            - `pymdurs.geometric.Lcz` - Local Climate Zone
            - `pymdurs.BoundingBox` - Bounding box operations
            - `pymdurs.GeoCore` - CRS and geographic operations

            ### Changes

            See the [changelog](https://github.com/rupeelab17/pymdurs/blob/main/CHANGELOG.md) for details.

            ### Requirements

            - Python >= 3.8
            - pandas >= 2.0.0
            - numpy < 2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
