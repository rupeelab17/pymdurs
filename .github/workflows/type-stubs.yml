name: Type stubs

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA
        type: string
      dry-run:
        description: Dry run
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  stubs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install GDAL (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --group dev

      - name: Regenerate stubs
        env:
          PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: ./scripts/generate-stubs.sh

      - name: Check stubs are up to date
        run: |
          git diff --exit-code -- pymdurs/pymdurs.pyi pymdurs/geometric/__init__.pyi pymdurs/thermal/__init__.pyi

      - name: Type-check examples
        run: uv run basedpyright pymdurs examples
