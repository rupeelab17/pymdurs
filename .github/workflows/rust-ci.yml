# CI Rust pour rsmdu (pas de Cargo workspace à la racine).
name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rsmdu

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system deps
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin libgeos-dev libproj-dev libclang-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rsmdu
      - run: cargo clippy --all-targets --features lidar-copc

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin libgeos-dev libproj-dev libclang-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rsmdu
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --features lidar-copc
      - run: cargo test --doc --features lidar-copc

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin libgeos-dev libproj-dev libclang-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rsmdu
      - run: cargo doc --no-deps --features lidar-copc

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.80" # sync with rsmdu/clippy.toml msrv
      - name: Install system deps
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin libgeos-dev libproj-dev libclang-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rsmdu
      - run: cargo check --features lidar-copc

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ./rsmdu/Cargo.toml
