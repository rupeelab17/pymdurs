name: Release Python (Windows)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA
        type: string
      dry-run:
        description: Dry run
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.sha || github.sha }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install GDAL (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install maturin
        run: pip install maturin

      - name: Create source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >
            --manifest-path pymdurs/Cargo.toml
            --out dist
          maturin-version: 1.11.4

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    needs: [build-sdist]
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: "pip"

      # Rust GNU (MinGW) + target
      - name: Install Rust GNU toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu
          rustup target add x86_64-pc-windows-gnu
          rustup default stable-x86_64-pc-windows-gnu
          rustc -V
          cargo -V

      # MSYS2: libs MinGW64 compatibles GNU (GEOS/GDAL/PROJ/SQLite)
      - name: Setup MSYS2 (mingw64)
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-geos
            mingw-w64-x86_64-gdal
            mingw-w64-x86_64-proj
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-pkgconf

      # Exporte variables de build + PATH (dll runtime + gdal tools)
      - name: Configure GDAL/GEOS/PROJ env (MSYS2)
        shell: pwsh
        run: |
          $prefix = "C:\msys64\mingw64"
          $lib    = "$prefix\lib"
          $inc    = "$prefix\include"
          $bin    = "$prefix\bin"
          $share  = "$prefix\share"

          Write-Host "MSYS2 prefix: $prefix"
          Write-Host "Bin: $bin"
          Write-Host "Lib: $lib"
          Write-Host "Inc: $inc"

          # PATH pour runtime et pour que les outils (gdalinfo) soient visibles si besoin
          "$bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # GEOS
          "GEOS_LIB_DIR=$lib"     | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GEOS_INCLUDE_DIR=$inc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # GDAL
          "GDAL_HOME=$prefix"     | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_LIB_DIR=$lib"     | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GDAL_INCLUDE_DIR=$inc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # PROJ (souvent requis au runtime via GDAL)
          "PROJ_LIB=$share\proj"  | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Debug utile si build script panic
          "RUST_BACKTRACE=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Alimente GEOS_VERSION pour geos-sys (évite le panic)
      - name: Set GEOS_VERSION from pacman
        shell: pwsh
        run: |
          $pkg = (& "C:\msys64\usr\bin\bash.exe" -lc "pacman -Qi mingw-w64-x86_64-geos | sed -n 's/^Version *: *//p'").Trim()
          if (-not $pkg) { throw "Cannot read GEOS version from pacman" }
          $ver = ($pkg -split "-")[0]
          "GEOS_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "GEOS_VERSION=$ver"

      # (Optionnel mais souvent utile) Vérifications de présence headers/libs
      - name: Sanity checks (headers/libs)
        shell: pwsh
        run: |
          $prefix = "C:\msys64\mingw64"
          if (-not (Test-Path "$prefix\include\geos_c.h")) { throw "Missing geos_c.h" }
          if (-not (Test-Path "$prefix\include\gdal.h"))   { throw "Missing gdal.h" }
          Write-Host "✅ Headers OK"

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: x86_64-pc-windows-gnu
          args: >
            --release
            --manifest-path pymdurs/Cargo.toml
            --out dist
          maturin-version: 1.11.4

      # Tests: PATH contient mingw64\bin -> DLL trouvées pendant l’import
      - name: Test wheel
        shell: bash
        run: |
          pip install --force-reinstall --verbose dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import pymdurs; print('pymdurs imported successfully')"
          python -c "import pymdurs; bbox = pymdurs.PyBoundingBox(-1.0, 46.0, 1.0, 47.0); print('PyBoundingBox works:', bbox.min_x)"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-x86_64
          path: dist/*.whl

  publish-to-pypi:
    needs: [build-sdist, build-wheels]
    environment:
      name: release-python
      url: https://pypi.org/project/pymdurs
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download sdists and wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        if: inputs.dry-run == false
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  publish-to-github:
    needs: [publish-to-pypi]
    if: inputs.dry-run == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Get version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m 1 -oP 'version = "\K[^"]+' pyproject.toml)
          if [[ "$VERSION" == *"-"* ]] || [[ "$VERSION" == *"dev"* ]] || [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"rc"* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          name: Python pymdurs ${{ steps.version.outputs.version }}
          tag_name: py-${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          files: dist/*
          body: |
            ## Python Package Release ${{ steps.version.outputs.version }}

            ### Installation
            ```bash
            pip install pymdurs
            ```

            ### Available Classes
            - `pymdurs.geometric.Building` - Building data collection
            - `pymdurs.geometric.Dem` - Digital Elevation Model
            - `pymdurs.geometric.Cadastre` - Cadastral parcel data
            - `pymdurs.geometric.Iris` - IRIS statistical units
            - `pymdurs.geometric.Lcz` - Local Climate Zone
            - `pymdurs.BoundingBox` - Bounding box operations
            - `pymdurs.GeoCore` - CRS and geographic operations

            ### Changes
            See the changelog in the repository for details.

            ### Requirements
            - Python >= 3.8
            - pandas >= 2.0.0
            - numpy < 2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
